<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>절연유체 파워모듈 냉각안 비교기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 좌측 입력 패널 + 우측 PDF 수행항목 순서 탭. 엔지니어링 계산서 톤 */
:root{
  --bg:#f4f6f8; --panel:#ffffff; --ink:#15202b; --muted:#5b6876; --line:#d9e0e7; --accent:#0b6e8a;
  --accent-soft:#e3f1f5; --warn:#a15c00; --warn-soft:#fff3df; --bad:#b42318; --good:#137a3f; --good-soft:#e5f5ec;
  --cA:#2563eb; --cB:#d97706; --cC:#059669; --cD:#be185d; --cR:#7b8794;
  --heat:#d9480f; --cool:#1c7ed6; --hot:#f08c00;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1418; --panel:#171e24; --ink:#e4eaf0; --muted:#97a4b2; --line:#2a343e; --accent:#4fb3cf;
    --accent-soft:#16303a; --warn:#f0b35a; --warn-soft:#33270f; --bad:#ff8a80; --good:#5fd08f; --good-soft:#13301f;
    --cA:#6c9cff; --cB:#f2a541; --cC:#34c99a; --cD:#f06aa8; --cR:#9aa5b1; --heat:#ff7a45; --cool:#5aa9ff; --hot:#ffb347;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1418; --panel:#171e24; --ink:#e4eaf0; --muted:#97a4b2; --line:#2a343e; --accent:#4fb3cf;
  --accent-soft:#16303a; --warn:#f0b35a; --warn-soft:#33270f; --bad:#ff8a80; --good:#5fd08f; --good-soft:#13301f;
  --cA:#6c9cff; --cB:#f2a541; --cC:#34c99a; --cD:#f06aa8; --cR:#9aa5b1; --heat:#ff7a45; --cool:#5aa9ff; --hot:#ffb347;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body)}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;font-weight:700;margin-bottom:8px}
h3{font-size:14px;font-weight:600;margin-bottom:6px}
p{margin:0 0 8px;max-width:75ch}
.num,td.n,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header.top{padding:16px 20px 12px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between}
header.top .sub{color:var(--muted);font-size:13px}
.summary{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;background:var(--bg);white-space:nowrap}
.chip b{font-weight:600}
.wrap{display:grid;grid-template-columns:330px 1fr;min-height:calc(100% - 80px)}
aside{border-right:1px solid var(--line);background:var(--panel);padding:12px 14px 40px;overflow-y:auto;max-height:calc(100vh - 0px);position:sticky;top:0}
main{padding:14px 20px 60px;min-width:0}
details.grp{border-bottom:1px solid var(--line);padding:8px 0}
details.grp>summary{cursor:pointer;font-weight:600;font-size:13px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.grp>summary::after{content:"＋";color:var(--muted)}
details.grp[open]>summary::after{content:"－"}
details.grp>summary .tag{font-weight:500;color:var(--muted);font-size:11px;margin-left:6px}
.fld{display:grid;grid-template-columns:1fr 92px;gap:6px;align-items:center;margin:6px 0}
.fld label{font-size:12.5px;color:var(--ink)}
.fld label small{color:var(--muted);font-size:11px}
input,select{font:13px var(--f-mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:100%}
select{font-family:var(--f-body)}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fld.wide{grid-template-columns:1fr}
.fld.fsel{grid-template-columns:1fr 150px}
.expl b.num{display:inline}
.modes{display:grid;gap:4px;margin:6px 0}
.modes label{display:flex;gap:6px;align-items:center;font-size:12.5px;cursor:pointer}
.modes input{width:auto}
.note{font-size:11.5px;color:var(--muted);margin:4px 0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;position:sticky;top:0;background:var(--bg);padding-top:4px;z-index:2}
.tab{border:1px solid transparent;border-bottom:none;background:none;color:var(--muted);font:600 13px var(--f-body);padding:7px 11px;border-radius:8px 8px 0 0;cursor:pointer}
.tab .k{font-family:var(--f-mono);font-weight:500;margin-right:4px;opacity:.75}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);border-color:var(--line);margin-bottom:-1px}
.view{display:none}
.view.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.req{font-size:12px;color:var(--muted);border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin-bottom:12px;max-width:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:11.5px;background:var(--bg);position:sticky;top:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr.best td{background:var(--good-soft)}
tr.grp td{background:var(--bg);font-weight:600;color:var(--muted);font-size:11.5px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.pill.b{background:var(--warn-soft);color:var(--bad)}
.warnlist{margin:4px 0 0;padding-left:18px;font-size:12px;color:var(--warn)}
.expl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.expl div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);font-size:12.5px}
.expl b{display:block;margin-bottom:2px}
svg text{font-family:var(--f-body)}
svg .mono{font-family:var(--f-mono)}
.btn{font:600 12.5px var(--f-body);border:1px solid var(--accent);color:var(--accent);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer}
.btn:hover{background:var(--accent-soft)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.row label{font-size:12.5px;display:flex;gap:6px;align-items:center}
.row select,.row input{width:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.winner{border:2px solid var(--good);background:var(--good-soft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
ul.tight{margin:4px 0;padding-left:18px}
ul.tight li{margin:2px 0}
.stps{display:flex;flex-wrap:wrap;gap:8px 22px;margin:6px 0 14px;counter-reset:s}
.stp{flex:1 1 150px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);position:relative;display:grid;gap:4px}
.stp:not(:last-child)::after{content:"→";position:absolute;right:-11px;top:50%;transform:translate(50%,-50%);color:var(--muted);font-weight:700}
.stp-n{font:600 11px var(--f-mono);color:var(--accent)}
.stp-t{font-weight:600;font-size:13px}
#v-adev .card .card{background:var(--bg)}
.adpicks{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.adpick{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
.adpick[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);padding:7px 13px}
.adpick b{font-family:var(--f-mono);margin-right:4px}
#v-adev>.card{scroll-margin-top:52px}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  aside{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  function props1p(f, T) {

    const cp = lin(f.cpPts, f.cp25, f.cpT);

  // ---------- 패키지 열저항 (45° 확산 근사) + 냉각기판 확산저항 (Lee-Song-Au-Moran 1995) ----------
  function packageR(p) {

  function baseR(p, Asrc, heff) {

  // ---------- 상관식 ----------
  function zukauskas(Re, Pr, stag, a, b, NL, Prs) {

      else if (Re < 1000) Nu = 0.71 * Math.pow(Re, 0.5);
      else Nu = 0.35 * Math.pow(a / b, 0.2) * Math.pow(Re, 0.6);
    }
    Nu *= Math.pow(Pr, 0.36) * Math.pow(Pr / (Prs || Pr), 0.25); // Zukauskas 원식의 벽면 Pr 보정
    // 행 수 보정 C₂ (Zukauskas, Çengel Table 7-3): [N_L, 엇갈림 Re>1000, 정렬 Re>1000, 엇갈림 Re<1000]. N_L ≥ 16이면 1
    const tbl = [[1, 0.64, 0.70, 0.83], [2, 0.76, 0.80, 0.87], [3, 0.84, 0.86, 0.91], [4, 0.89, 0.90, 0.94], [5, 0.93, 0.93, 0.95], [7, 0.95, 0.95, 0.97], [10, 0.97, 0.97, 0.98], [13, 0.98, 0.98, 0.99], [16, 1, 1, 1]];
    const col = stag ? (Re < 1000 ? 3 : 1) : 2;
    let C2 = 1;
    if (NL < 16) {
      if (NL <= 1) C2 = tbl[0][col];
      else for (let i = 0; i < tbl.length - 1; i++) {
        if (NL >= tbl[i][0] && NL <= tbl[i + 1][0]) {
          const s = (NL - tbl[i][0]) / (tbl[i + 1][0] - tbl[i][0]);
          C2 = tbl[i][col] + s * (tbl[i + 1][col] - tbl[i][col]);
        }

  // Gaddis & Gnielinski (1985, VDI Heat Atlas) 관군 압력손실계수 (Re: 최소단면 유속 기준)
  function gaddis(Re, a, b, stag) {
    const base = 280 * Math.PI * (Math.pow(Math.pow(b, 0.5) - 0.6, 2) + 0.75);
    let fl, ft, xt;
    if (!stag) {
      fl = base / ((4 * a * b - Math.PI) * Math.pow(a, 1.6));
      ft = (0.22 + 1.2 * Math.pow(Math.max(1 - 0.94 / b, 0.01), 0.6) / Math.pow(Math.max(a - 0.85, 0.05), 1.3)) * Math.pow(10, 0.47 * (b / a - 1.5)) + 0.03 * (a - 1) * (b - 1);
      xt = ft / Math.pow(Re, 0.1 * b / a);
    } else {
      const c = (b >= 0.5 * Math.sqrt(2 * a + 1)) ? a : Math.sqrt(a * a / 4 + b * b);
      fl = base / ((4 * a * b - Math.PI) * Math.pow(c, 1.6));
      ft = 2.5 + 1.2 / Math.pow(Math.max(a - 0.85, 0.05), 1.08) + 0.4 * Math.pow(b / a - 1, 3) - 0.01 * Math.pow(a / b - 1, 3);

  // Martin (1977) 원형 노즐 배열
  function martin(Re, Pr, d, S, Hgap) {

    const Hd = Hgap / d, sf = Math.sqrt(f);

    const G = 2 * sf * (1 - 2.2 * sf) / (1 + 0.2 * (Hd - 6) * sf);
    return { Nu: K * G * 0.5 * Math.pow(Re, 2 / 3) * Math.pow(Pr, 0.42), f, Hd };
  }
  function finEff(h, k, D, H) { // 원형 핀, 끝단 단열 공식. A는 실제 높이, C는 보정 길이 L_c = H + D/4를 넣어 끝단 대류 근사

    const mm = g * 1e3;
    if (mm >= 1.0) return 5; if (mm >= 0.5) return 4 + (mm - 0.5) / 0.5; if (mm >= 0.3) return 3 + (mm - 0.3) / 0.2;

  // ---------- 냉각면 모델: 각 함수는 (V, fluid props, p) → 대류측 결과 ----------
  // 반환: heff(설치면적 기준), dp, rcalF(×1/(ṁcp)), devF, uniform, minGap, info, warn
  function coolA(V, fp, p, g) { // 마이크로필라 미세유로
    const D = g.D, H = g.H, ST = g.ST, SL = g.SL, stag = g.arr === 'stag';
    const a = ST / D, b = SL / D;
    const NT = Math.floor(p.W / ST), NL = Math.floor(p.L / SL);
    const N = stag ? Math.round(NT * NL - Math.floor(NL / 2)) : NT * NL;
    const uin = V / (p.W * H);
    let umax = uin * ST / (ST - D), SD = null;
    if (stag) { SD = Math.sqrt(SL * SL + (ST / 2) ** 2); if (SD < (ST + D) / 2) umax = uin * ST / (2 * (SD - D)); }
    const Re = fp.rho * umax * D / fp.mu;
    const Nu = zukauskas(Re, fp.Pr, stag, a, b, NL, fp.Prs);
    const h = Nu * fp.k / D;
    const eta = finEff(h, p.kBase, D, H);
    const A = p.L * p.W, Ab = A - N * Math.PI * D * D / 4, Af = N * Math.PI * D * H;
    const heff = h * (Ab + eta * Af) / A;

    const dpCore = xi * NL * fp.rho * umax * umax / 2;
    const uh = V / (p.W * g.Hhdr);
    const dpMinor = 1.5 * fp.rho * uin * uin / 2 + 1.0 * fp.rho * uh * uh / 2;
    const maldist = 0.5 * (fp.rho * uh * uh / 2) / dpCore;
    const porosity = 1 - Math.PI * D * D / 4 / (ST * SL);
    const gap = Math.min(ST - D, stag ? (SD - D) : SL - D);
    const warn = [];
    if (Re > 2e5) warn.push('Re가 Zukauskas 적용범위 초과');
    if (Re < 1) warn.push('Re<1: 상관식 외삽');
    if (H / D < 2) warn.push('H/D<2: 짧은 핀 → 끝벽 효과로 상관식 오차 큼(마이크로 핀핀 문헌 대비 과대 가능)');
    if (a < 1.25 || b < 1.25) warn.push('피치/직경<1.25: Gaddis 압력손실식 범위 밖');
    if (gap < 0.15e-3) warn.push('최소 간극<0.15 mm: 막힘 위험 큼');
    return {
      heff, h, Nu, Re, eta, dp: dpCore + dpMinor, dpCore, rcalF: 0.5 + 0.5 * p.chipL / p.L,
      devF: Math.min(1, (p.chipL + 2e-3) / p.L), convDev: 0.08, uniform: clamp(1 - maldist, 0, 1), minGap: gap,
      info: { N, NT, NL, porosity, areaRatio: (Ab + Af) / A, uin, umax, xi }, warn
    };
  }

  // 노즐 입구 형상별 손실계수 (Idelchik): 날카로움 0.5, 모따기 0.25, 라운딩 0.05
  const KIN = { sharp: 0.5, chamfer: 0.25, round: 0.05 };
  // Shah(1978) 원관 발달 층류 겉보기 마찰계수 (Fanning): 입구 발달(Hagenbach) 효과 포함
  function fappShah(Re, Ld) {

  function fHaaland(Re, rr) { const x = -1.8 * Math.log10(Math.pow(rr / 3.7, 1.11) + 6.9 / Re); return 1 / (x * x); }

    const nx = Math.floor(p.L / S), ny = Math.floor(p.W / S), N = nx * ny;
    const Aj = Math.PI * d * d / 4;

    const Re = fp.rho * vj * d / fp.mu;
    const q = fp.rho * vj * vj / 2;
    const Kin = KIN[inlet] ?? 0.5;
    const rr = (rough || 0) / d;
    // 층류: 발달 층류 겉보기 마찰(조도 무관) / 난류: Haaland(조도 반영, 완전발달) / 천이 2300~4000: 선형 보간
    const lamF = 4 * fappShah(Math.min(Re, 2300), ln / d) * (ln / d);   // Darcy 기준 마찰항 계수 (Re<2300일 때)

    const w = Re <= 2300 ? 0 : Re >= 4000 ? 1 : (Re - 2300) / 1700;
    const kf = (1 - w) * lam + w * tur;

    const fric = kf * q;

    return { nx, ny, N, vj, Re, dpNoz, up, dpPlen, nozParts: { dpIn, fric, dpOut, Kin, kf, kfFD: (Re < 2300 ? 64 / Re : fHaaland(Re, rr)) * ln / d, xp: ln / d / Re, rr, regime } };
  }

  function coolB(V, fp, p, g) { // 평탄면 임핀징 제트 배열
    const jc = jetCore(V, fp, p, g.d, g.S, g.ln, g.Hp, g.inlet, g.rough);
    const m = martin(jc.Re, fp.Pr, g.d, g.S, g.Hj);

    if (jc.Re < 2000) warn.push(`Re_j=${jc.Re.toFixed(0)} < 2000: Martin 상관식 하한 밖(외삽)`);

    if (m.Hd < 2 || m.Hd > 12) warn.push(`H/d=${m.Hd.toFixed(1)}: 범위(2~12) 밖`);
    if (g.exh === 'side') warn.push('측면 배출: 교차류 감쇠계수는 근사값');

      rcalF, devF, convDev: g.exh === 'side' ? 0.12 : 0.15, uniform: clamp(1 - maldist, 0, 1), minGap: g.d,
      info: { N: jc.N, nx: jc.nx, ny: jc.ny, vj: jc.vj, f: m.f, Hd: m.Hd, crossflow: cf, noz: jc.nozParts, dpExh, dpPlen: jc.dpPlen }, warn
    };
  }

  function coolC(V, fp, p, g) { // 제트 + 마이크로필라
    const jc = jetCore(V, fp, p, g.d, g.S, g.ln, g.Hp, g.inlet, g.rough);
    const s = Math.max(g.Hj - g.Hpil, 0.05e-3);
    const m = martin(jc.Re, fp.Pr, g.d, g.S, Math.max(s, g.d));
    const hj = m.Nu * fp.k / g.d * g.chi;
    const Np0 = Math.floor(p.L / g.Sp) * Math.floor(p.W / g.Sp);
    const excl = jc.N * Math.max(1, Math.round(Math.PI * g.d * g.d / (4 * g.Sp * g.Sp)));
    const Np = Math.max(0, Np0 - excl);
    const Lc = g.Hpil + g.Dp / 4;              // 보정 핀 길이 (끝단 대류 근사, Harper & Brown · Incropera 3장). 열전달 계산에만 사용
    const eta = finEff(hj, p.kBase, g.Dp, Lc);
    const A = p.L * p.W, Ab = A - Np * Math.PI * g.Dp ** 2 / 4, Af = Np * Math.PI * g.Dp * Lc;
    const heff = hj * (Ab + eta * Af) / A;
    // 필라 사이 반경방향 통과 손실
    const Vj = V / jc.N, r = g.S / 4;
    const ur = Vj / (2 * Math.PI * r * g.Hpil);
    const umax = ur * g.Sp / (g.Sp - g.Dp);
    const Rep = fp.rho * umax * g.Dp / fp.mu;
    const ap = g.Sp / g.Dp;
    const Nr = Math.max(1, Math.round(g.S / (2 * g.Sp)));
    const dpPin = gaddis(Math.max(Rep, 0.5), ap, ap, false) * Nr * fp.rho * umax * umax / 2;
    const dpExh = 0.25 * fp.rho * jc.vj * jc.vj / 2;
    const maldist = 0.5 * jc.dpPlen / (jc.dpNoz + dpPin);
    const warn = [];
    if (jc.Re < 2000) warn.push(`Re_j=${jc.Re.toFixed(0)} < 2000: Martin 상관식 외삽`);
    if (jc.nozParts.regime !== '층류') warn.push(`노즐 내부 ${jc.nozParts.regime} (Re ${jc.Re.toFixed(0)}): 조도 반영`);
    if (g.Hj <= g.Hpil + 0.1e-3) warn.push('제트-필라 끝 간격이 0.1 mm 이하: 유동 정체·우회 위험');
    if (s / g.d < 1) warn.push('필라 끝까지 거리/노즐직경<1: 제트 상관식 범위 밖');
    warn.push(`χ=${g.chi}: 필라에 의한 벽면제트 감쇠계수(가정값, 문헌·CFD로 보정 필요)`);
    return {
      heff, h: hj, Nu: m.Nu, Re: jc.Re, eta, dp: jc.dpNoz + jc.dpPlen + dpPin + dpExh, dpCore: jc.dpNoz + dpPin,
      rcalF: 0.1, devF: 0.05, convDev: 0.08, uniform: clamp(1 - maldist, 0, 1), minGap: Math.min(g.d, g.Sp - g.Dp),
      info: { N: jc.N, Np, nx: jc.nx, ny: jc.ny, vj: jc.vj, f: m.f, Hd: s / g.d, areaRatio: (Ab + Af) / A, porosity: 1 - Math.PI * g.Dp ** 2 / 4 / g.Sp ** 2, dpPin, RePin: Rep, Lc, noz: jc.nozParts, dpExh, dpPlen: jc.dpPlen }, warn
    };
  }

  function coolD(V, tf, p, g, Tin, Asrc) { // 2상 미세채널 (포화 입구, T_sat,in = T_in)
    const wc = g.wc, ww = g.ww, Hc = g.Hc;
    const N = Math.floor(p.W / (wc + ww));
    const rhoG = rhoV(tf, Tin), rhoL = tf.rhoL;
    const mdot = rhoL * V;
    const G = mdot / (N * wc * Hc);
    const Dh = 4 * wc * Hc / (2 * (wc + Hc));
    const xout = p.Q / (mdot * tf.hfg);
    const x = clamp(xout / 2, 0.005, 0.95);
    const PH = wc + 2 * Hc, PF = 2 * wc + 2 * Hc;
    const qH = p.Q / (N * p.L * PH);
    const Bo = qH / (G * tf.hfg);
    const PR = psat(tf, Tin) / (tf.Pc || 3e6);
    const Ref = G * (1 - x) * Dh / tf.muL;
    const Prf = tf.muL * tf.cpL / tf.kL;
    const Wefo = G * G * Dh / (rhoL * tf.sigma);
    const Xtt = Math.pow(tf.muL / tf.muV, 0.1) * Math.pow((1 - x) / x, 0.9) * Math.pow(rhoG / rhoL, 0.5);
    const hsp = 0.023 * Math.pow(Ref, 0.8) * Math.pow(Prf, 0.4) * tf.kL / Dh;
    const hnb = 2345 * Math.pow(Bo * PH / PF, 0.7) * Math.pow(PR, 0.38) * Math.pow(1 - x, -0.51) * hsp;
    const hcb = (5.2 * Math.pow(Bo * PH / PF, 0.08) * Math.pow(Wefo, -0.54) + 3.5 * Math.pow(1 / Xtt, 0.94) * Math.pow(rhoG / rhoL, 0.25)) * hsp;
    const h = Math.sqrt(hnb * hnb + hcb * hcb);
    const m = Math.sqrt(2 * h / (p.kBase * ww)), mH = m * Hc;
    const eta = Math.tanh(mH) / mH;
    const heff = h * (wc + 2 * eta * Hc) / (wc + ww);
    // 균질류 압력강하
    const vf = 1 / rhoL, vg = 1 / rhoG, vfg = vg - vf;
    const muTP = 1 / (x / tf.muV + (1 - x) / tf.muL);
    const ReTP = G * Dh / muTP;
    const alpha = Math.min(wc, Hc) / Math.max(wc, Hc);
    const fF = ReTP < 2300 ? poiseuilleRect(alpha) / ReTP : 0.079 * Math.pow(ReTP, -0.25);
    const dpF = 2 * fF * G * G * p.L / Dh * vf * (1 + xout / 2 * vfg / vf);
    const dpAcc = G * G * vfg * xout;
    const uin = V / (p.W * Hc);
    const uh = V / (p.W * g.Hhdr);
    const Gc = mdot / (p.W * Hc);
    const dpMinor = 1.5 * rhoL * uin * uin / 2 + 1.0 * Gc * Gc * vf * (1 + xout * vfg / vf) / 2 + rhoL * uh * uh / 2;
    const dp = dpF + dpAcc + dpMinor;
    const Pin = psat(tf, Tin), Pout = Pin - dp;
    const TsatOut = Pout > 1000 ? tsat(tf, Pout) : -99;
    // CHF (Qu & Mudawar 2004) vs 국부 피크 열유속
    const WeL = G * G * p.L / (tf.sigma * rhoL);
    const qCHF = 33.43 * G * tf.hfg * Math.pow(rhoG / rhoL, 1.11) * Math.pow(WeL, -0.21) * Math.pow(p.L / Dh, -0.36);
    const qPeak = qH * Math.sqrt((p.L * p.W) / Asrc);
    const chfMargin = qCHF / qPeak;
    const maldist = 0.5 * (rhoL * uh * uh / 2) / dp;
    const warn = [];
    if (xout > 1) warn.push(`출구 건도 ${xout.toFixed(2)} > 1: 완전 증발(건조) — 유량 부족`);
    else if (xout > 0.6) warn.push(`출구 건도 ${xout.toFixed(2)} > 0.6: 건조영역(dry-out) 위험`);
    if (chfMargin < 1.5) warn.push(`CHF 여유 ${chfMargin.toFixed(2)} < 1.5: 임계열유속 위험`);
    if (Pout < 0.3 * Pin) warn.push('압력강하가 입구압의 70% 초과: 포화온도 급변·플래싱');
    if (Pin < 101325) warn.push(`작동압력 ${(Pin / 1e5).toFixed(2)} bar < 대기압: 공기 유입 방지 필요`);
    warn.push('2상 미세채널은 압력·유량 진동(Ledinegg 불안정) 가능 → 입구 오리피스 권장');
    return {
      heff, h, Nu: h * Dh / tf.kL, Re: G * Dh / tf.muL, eta, dp, dpCore: dpF + dpAcc, rcalF: 0, devF: 0,
      convDev: 0.08, uniform: clamp(1 - maldist, 0, 1) * (xout > 0.6 ? 0.85 : 1), minGap: wc,
      tp: { xout, G, Pin, Pout, TsatOut, dTsat: Tin - TsatOut, rhoG, qCHF, qPeak, chfMargin, Bo, hnb, hcb, mdot },
      info: { N, Dh, G, areaRatio: (wc + 2 * Hc) / (wc + ww) }, warn
    };
  }

  function coolRef(V, fp, p, g) { // 기준: 평탄 미세유로 (필라 없음, 채널 높이 = A의 H)
    const H = g.H, Dh = 2 * H;
    const u = V / (p.W * H);
    const Re = u * Dh / fp.nu;
    let Nu;
    if (Re < 2300) {
      const Gz = Dh / p.L * Re * fp.Pr; // 입구영역 보정(Stephan 형태 근사)
      Nu = 5.385 + 0.024 * Math.pow(Gz, 1.14) / (1 + 0.0358 * Math.pow(Gz, 0.64) * Math.pow(fp.Pr, 0.17));
    } else {
      const f = Math.pow(0.79 * Math.log(Re) - 1.64, -2);
      Nu = (f / 8) * (Re - 1000) * fp.Pr / (1 + 12.7 * Math.sqrt(f / 8) * (Math.pow(fp.Pr, 2 / 3) - 1));
    }
    const h = Nu * fp.k / Dh;
    const fD = Re < 2300 ? 96 / Re : 0.316 * Math.pow(Re, -0.25);
    const dp = fD * p.L / Dh * fp.rho * u * u / 2 + 1.5 * fp.rho * u * u / 2;
    return { heff: h, h, Nu, Re, eta: 1, dp, dpCore: dp, rcalF: 0.5 + 0.5 * p.chipL / p.L, devF: Math.min(1, (p.chipL + 2e-3) / p.L), convDev: 0.05, uniform: 0.95, minGap: H, info: { u }, warn: [] };
  }

  // ---------- 한 경우 평가 ----------
  function evaluate(cs, V, P) {
    const p = P.common;
    const pk = packageR(p);
    let cr, fp = null, Tf = P.Tin, ref;
    if (cs.type === 'D') {
      const tf = TPFLUIDS[cs.fluid];
      cr = coolD(V, tf, p, P.geo.D, P.Tin, pk.Asrc);
      ref = { rho: tf.rhoL, cp: tf.cpL };
    } else {
      const f = FLUIDS[cs.fluid];
      fp = props1p(f, P.Tin);
      let Ts = null;
      for (let it = 0; it < 5; it++) {
        const fn = cs.type === 'A' ? coolA : cs.type === 'B' ? coolB : cs.type === 'C' ? coolC : coolRef;
        const gg = cs.type === 'REF' ? P.geo.A : P.geo[cs.type];
        cr = fn(V, fp, p, gg);
        const mdot = fp.rho * V;
        const dT = p.Q / (mdot * fp.cp);
        Tf = P.Tin + Math.min(dT, 150) / 2;
        const Awet = p.L * p.W * ((cr.info && cr.info.areaRatio) || 1);
        Ts = Tf + Math.min(p.Q / (cr.h * Awet), 200); // 젖은 면적 평균 냉각면 온도 = T_f + Q/(h·A_wet)
        fp = props1p(f, Tf);
        fp.Ts = Ts; fp.Prs = props1p(f, Ts).Pr;
      }
      ref = fp;
    }
    const mdot = ref.rho * V;
    const br = baseR(p, pk.Asrc, cr.heff);
    const Rcal = cs.type === 'D' ? 0 : cr.rcalF / (mdot * ref.cp);
    const Rtot = pk.Rpkg + br.R1D + br.Rsp + br.Rconv + Rcal;
    const Tj = P.Tin + p.Q * Rtot;
    const dTf = cs.type === 'D' ? 0 : p.Q / (mdot * ref.cp);
    let dev = cr.devF * dTf + cr.convDev * p.Q * br.Rconv;
    if (cs.type === 'D') dev += Math.max(0, cr.tp.dTsat);
    const W = cr.dp * V / P.etaPump;
    const warn = cr.warn.slice();
    if (cs.type !== 'D' && Tf > 0 && dTf > 40) warn.push(`유체 온도상승 ${dTf.toFixed(0)} K: 유량 부족`);
    return {
      cs, V, mdot, dp: cr.dp, W, Tj, Rth: Rtot, dTf, Tout: P.Tin + dTf, dev,
      R: { layers: pk.layers, Rpkg: pk.Rpkg, R1D: br.R1D, Rsp: br.Rsp, Rconv: br.Rconv, Rcal },
      Bi: br.Bi, cr, fp, warn, feasible: !(cs.type === 'D' && cr.tp.xout > 1)
    };
  }

  // ---------- 비교 조건으로 유량 결정 ----------
  function solve(cs, P, mode, target) {
    let lo = 1e-8, hi = 2e-3;
    if (cs.type === 'D') {
      const tf = TPFLUIDS[cs.fluid];
      lo = P.common.Q / (0.98 * tf.hfg) / tf.rhoL;
    }
    if (mode === 'flow') return evaluate(cs, Math.max(target, cs.type === 'D' ? 0 : 0), P);
    const fn = V => { const r = evaluate(cs, V, P); return mode === 'power' ? r.W : r.dp; };
    if (fn(lo) > target) { const r = evaluate(cs, lo, P); r.limited = true; return r; }
    if (fn(hi) < target) { const r = evaluate(cs, hi, P); r.limited = true; return r; }
    let a = Math.log(lo), b = Math.log(hi);
    for (let i = 0; i < 60; i++) {
      const m = (a + b) / 2;
      if (fn(Math.exp(m)) > target) b = m; else a = m;
    }
    return evaluate(cs, Math.exp((a + b) / 2), P);
  }

  // ---------- 가중치 평가 ----------
  const CRIT = [
    { key: 'Tj', name: '칩 최고온도', w: 20, dir: -1 },
    { key: 'dev', name: '칩 온도편차', w: 10, dir: -1 },
    { key: 'Rth', name: '접합부-유체 열저항', w: 10, dir: -1 },
    { key: 'uniform', name: '유량 균일도', w: 10, dir: 1 },
    { key: 'dp', name: '압력강하', w: 5, dir: -1 },
    { key: 'W', name: '순환(펌프)동력', w: 5, dir: -1 },
    { key: 'clog', name: '막힘·세척성', w: 10, dir: 1, qual: true },
    { key: 'fab', name: '제작·접합 가능성', w: 10, dir: 1, qual: true },
    { key: 'diel', name: '전기절연', w: 10, dir: 1, qual: true },
    { key: 'cost', name: '비용', w: 10, dir: 1, qual: true }
  ];
  function rawMetric(r, key, P) {
    switch (key) {
      case 'Tj': return r.Tj; case 'dev': return r.dev; case 'Rth': return r.Rth; case 'uniform': return r.cr.uniform;
      case 'dp': return r.dp; case 'W': return r.W;
      case 'clog': return gapScore(r.cr.minGap);
      case 'fab': return P.fab[r.cs.type];
      case 'diel': return r.cs.type === 'D' ? TPFLUIDS[r.cs.fluid].diel : FLUIDS[r.cs.fluid].diel;
      case 'cost': {
        const fc = r.cs.type === 'D' ? TPFLUIDS[r.cs.fluid].cost : FLUIDS[r.cs.fluid].cost;
        return clamp(P.costBase[r.cs.type] + fc, 1, 5);
      }
    }
  }
  function score(results, weights, P) {
    const ok = results.filter(r => r.feasible);
    const table = results.map(r => ({ r, s: {}, raw: {}, total: 0 }));
    for (const c of CRIT) {
      const vals = ok.map(r => rawMetric(r, c.key, P));
      const mn = Math.min(...vals), mx = Math.max(...vals);
      for (const row of table) {
        const v = rawMetric(row.r, c.key, P);
        row.raw[c.key] = v;
        let s;
        if (c.qual) s = v;
        else if (c.key === 'uniform') s = 1 + 4 * clamp((v - 0.8) / 0.2, 0, 1); // 절대척도: 차이가 1%p 수준이면 점수차도 작게
        else if (mx - mn < 1e-12 * Math.max(1, Math.abs(mx))) s = 5;
        else s = c.dir < 0 ? 1 + 4 * (mx - v) / (mx - mn) : 1 + 4 * (v - mn) / (mx - mn);
        row.s[c.key] = clamp(s, 1, 5);
      }
    }
    const wsum = CRIT.reduce((s, c) => s + (weights[c.key] || 0), 0) || 1;
    for (const row of table) {
      row.total = row.r.feasible ? CRIT.reduce((s, c) => s + row.s[c.key] * (weights[c.key] || 0), 0) / wsum * 20 : 0;
    }
    return table;
  }

  return { FLUIDS, TPFLUIDS, MAT, props1p, psat, tsat, rhoV, packageR, baseR, evaluate, solve, score, CRIT, gapScore };
})();
if (typeof module !== 'undefined') module.exports = TC;

</script>

(function () {

    ],

    B: [['d', '노즐 직경 d', 'mm', 0.5], ['S', '노즐 간격 S (정사각 배열)', 'mm', 2.5], ['Hj', '제트-표면 거리 H', 'mm', 1.5], ['ln', '노즐 길이 (판 두께)', 'mm', 1.0], ['Hp', '공급 플레넘 높이', 'mm', 3], ['rough', '노즐 내벽 조도 ε', 'µm', 2]],
    C: [['d', '노즐 직경 d', 'mm', 0.5], ['S', '노즐 간격 S', 'mm', 2.5], ['Hj', '제트-기판 거리 H', 'mm', 1.5], ['ln', '노즐 길이', 'mm', 1.0], ['Hp', '공급 플레넘 높이', 'mm', 3], ['rough', '노즐 내벽 조도 ε', 'µm', 2],
      ['Dp', '필라 직경 D_p', 'mm', 0.4], ['Hpil', '필라 높이 H_p', 'mm', 0.8], ['Sp', '필라 피치 S_p (정렬)', 'mm', 0.8], ['chi', '벽면제트 감쇠계수 χ', '–', 1.0]],
    D: [['wc', '채널 폭 w_c', 'mm', 0.3], ['ww', '채널 벽 두께 w_w', 'mm', 0.2], ['Hc', '채널 높이 H_c', 'mm', 1.0], ['Hhdr', '입출구 헤더 높이', 'mm', 3]]
  };
  const QUAL = { fab: { A: 4, B: 3, C: 2, D: 2 }, cost: { A: 4, B: 3.5, C: 2.5, D: 1.5 } };

  function fld(id, label, unit, val, step) {

  function sel(id, label, opts, val) {

  }
  function buildInputs() {

        <div class="tblwrap"><table><thead><tr><th>모델</th><th>사용 식 (원 문헌 계수)</th><th>적용 범위</th><th>이 설계에서</th></tr></thead><tbody>
        <tr><td>Zukauskas (1972) 관군</td><td class="mono" style="font-size:12px">엇갈림: 1.04Re^0.4 (1–500), 0.71Re^0.5 (500–1e3), 0.35(S_T/S_L)^0.2 Re^0.6 (1e3–2e5) × Pr^0.36·(Pr/Pr_s)^0.25<br>정렬: 0.9Re^0.4, 0.52Re^0.5, 0.27Re^0.63</td><td>Re 1–2×10⁵, 0.7 < Pr < 500, 긴 관</td><td>Re 60–250 범위 안. (Pr/Pr_s)^0.25 벽면 보정 포함. 짧은 핀(H/D = 2)이라 끝벽 효과로 오차 가능</td></tr>
        <tr><td>Gaddis & Gnielinski (1985)</td><td class="mono" style="font-size:12px">ξ = f_a,l/Re + f_a,t/Re^0.25·(1 − e^−(Re+1000)/2000), f_a,l = 280π[(√b−0.6)²+0.75]/((4ab−π)·c^1.6)</td><td>Re 1–3×10⁵, a·b ≥ 1.25</td><td>범위 안 (a = b = 2)</td></tr>
        <tr><td>Martin (1977) 노즐 배열</td><td class="mono" style="font-size:12px">Nu = K·G·0.5Re^(2/3)·Pr^0.42</td><td>Re 2000–10⁵, f 0.004–0.04, H/d 2–12</td><td><b>Re 약 170으로 범위 밖(외삽)</b>. B·C의 h는 불확실성이 큼. NREL 실측 h 대비 C는 낮게(보수적) 나옴</td></tr>
        <tr><td>Lee, Song, Au & Moran (1995)</td><td class="mono" style="font-size:12px">ψ_max = ετ/√π + (1−ε)Φ_c/√π</td><td>원형 등가, 균일 h</td><td>정사각형을 원형 등가로 근사</td></tr>
        <tr><td>핀 효율</td><td class="mono" style="font-size:12px">η = tanh(mH)/(mH)</td><td>끝단 단열, 균일 h</td><td>커버 접촉 필라에 적합</td></tr>
        <tr><td>점도 Andrade</td><td class="mono" style="font-size:12px">ln ν = A + B/T (두 점 맞춤)</td><td>두 점 사이 온도</td><td>70 °C에서 NREL 실측과 0.7% 차이. 0 °C 이하에서는 부정확</td></tr>
        </tbody></table></div>
        <p class="note">결론: 구현은 정확합니다. 결과의 불확실성은 상관식 선택(특히 B·C의 Martin 외삽)에서 나옵니다. 보고서에는 "상관식 기반 1차 설계이며, CFD나 실험으로 확인이 필요하다"고 명시하세요.</p></div>`;
    $('#vSel').addEventListener('change', e => { vSel = e.target.value; renderVerify(); });
  }

  // ---------------- 1) 열전달 경로 ----------------
  let pathSel = 'A';
  function stackSVG(r, P) {
    const t = r.cs.type, Wd = 880, Hd = 470;
    const x0 = 30, w0 = 330, cx = x0 + w0 / 2;
    const cw = Math.max(70, w0 * P.common.chipL / P.common.L * 0.9);
    const layersVis = [
      ['SiC 다이 (열원)', cw, 26, 'var(--heat)', 0.85],
      ['다이 접합', cw + 8, 8, '#9aa5b1', 1],
      ['DBC 상부 Cu', cw + 50, 16, '#c77d3a', 1],
      ['세라믹 (절연)', cw + 80, 16, '#e9ecef', 1],
      ['DBC 하부 Cu', cw + 80, 16, '#c77d3a', 1],
      ['기판 접합', cw + 80, 7, '#9aa5b1', 1],
      ['열확산판·냉각기판', w0, 34, '#b8692e', 1]
    ];
    let y = 34, s = '';
    s += `<text x="${x0}" y="18" font-size="12" font-weight="600" fill="var(--ink)">구조 단면 (개략, 비례 아님) · ${r.cs.id} ${esc(r.cs.long)}</text>`;
    const ys = [];
    layersVis.forEach(([n, w, h, c, o]) => {
      s += `<rect x="${cx - w / 2}" y="${y}" width="${w}" height="${h}" fill="${c}" fill-opacity="${o}" stroke="var(--ink)" stroke-opacity=".35"/>`;
      ys.push([n, y + h / 2]);
      y += h;
    });
    const yb = y; // 냉각면
    const fh = 70;
    s += `<rect x="${x0}" y="${yb}" width="${w0}" height="${fh}" fill="var(--cool)" fill-opacity=".12" stroke="var(--cool)" stroke-opacity=".5"/>`;
    if (t === 'A' || t === 'REF') {
      if (t === 'A') for (let i = 0; i < 14; i++) { const px = x0 + 10 + i * 23.3; s += `<rect x="${px}" y="${yb}" width="9" height="${fh - 12}" fill="#b8692e"/>`; }
      s += `<rect x="${x0}" y="${yb + fh - 12}" width="${w0}" height="12" fill="var(--muted)" fill-opacity=".35"/>`;
      s += arrow(x0 - 26, yb + 26, x0 + 4, yb + 26, 'var(--cool)') + arrow(x0 + w0 - 4, yb + 26, x0 + w0 + 26, yb + 26, 'var(--hot)');
      s += `<text x="${x0}" y="${yb + fh + 16}" font-size="11" fill="var(--muted)">유동 → (필라 사이 채널, 커버 단열)</text>`;
    } else if (t === 'B' || t === 'C') {
      if (t === 'C') for (let i = 0; i < 18; i++) { const px = x0 + 8 + i * 18; if (i % 4 === 1) continue; s += `<rect x="${px}" y="${yb}" width="7" height="${fh * 0.45}" fill="#b8692e"/>`; }
      s += `<rect x="${x0}" y="${yb + fh - 14}" width="${w0}" height="14" fill="var(--muted)" fill-opacity=".45"/>`;
      for (let i = 0; i < 5; i++) { const nx = x0 + 34 + i * 66 + (t === 'C' ? -1 : 0); s += `<rect x="${nx - 4}" y="${yb + fh - 14}" width="8" height="14" fill="var(--panel)"/>` + arrow(nx, yb + fh + 22, nx, yb + 4, 'var(--cool)'); }
      s += `<text x="${x0}" y="${yb + fh + 36}" font-size="11" fill="var(--muted)">↑ 노즐판에서 냉각기판 바닥으로 제트 충돌 · 사용 유체 분산 회수</text>`;
    } else if (t === 'D') {
      for (let i = 0; i < 20; i++) { const px = x0 + 4 + i * 16.5; s += `<rect x="${px}" y="${yb}" width="6" height="${fh - 12}" fill="#b8692e"/>`; }
      s += `<rect x="${x0}" y="${yb + fh - 12}" width="${w0}" height="12" fill="var(--muted)" fill-opacity=".35"/>`;
      for (let i = 0; i < 9; i++) s += `<circle cx="${x0 + 30 + i * 34}" cy="${yb + 18 + (i % 3) * 12}" r="${2 + i * 0.4}" fill="none" stroke="var(--cool)"/>`;
      s += arrow(x0 - 26, yb + 26, x0 + 4, yb + 26, 'var(--cool)') + arrow(x0 + w0 - 4, yb + 26, x0 + w0 + 26, yb + 26, 'var(--hot)');
      s += `<text x="${x0}" y="${yb + fh + 16}" font-size="11" fill="var(--muted)">액체 유입 → 채널 내 비등(잠열) → 2상 유출</text>`;
    }
    for (let i = 0; i < 3; i++) s += arrow(cx - 30 + i * 30, 40, cx - 30 + i * 30 + (i - 1) * 40, yb + 28, 'var(--heat)', 0.5);
    // 열저항망 (오른쪽)
    const R = r.R, Q = P.common.Q;
    const items = R.layers.map(l => ({ n: l.name, v: l.R, g: 'pkg' }))
      .concat([{ n: '냉각기판 1D 전도 R_1D', v: R.R1D, g: 'base' }, { n: '확산저항 R_sp', v: R.Rsp, g: 'imp' }, { n: '대류 R_conv = 1/(h_eff·A)', v: R.Rconv, g: 'imp' }]);
    if (t !== 'D') items.push({ n: '유체 열용량 R_cal', v: R.Rcal, g: 'imp' });
    const tot = items.reduce((a, b) => a + b.v, 0);
    const rx = 450, ry0 = 34, step = (Hd - 70) / items.length;
    let T = r.Tj;
    s += `<text x="${rx}" y="18" font-size="12" font-weight="600" fill="var(--ink)">직렬 열저항망 · R_th,j-f = ${fmt(r.Rth, 3)} K/W</text>`;
    s += node(rx, ry0, `T_j,max ${fmt(T, 1)} °C`);
    items.forEach((it, i) => {
      const yA = ry0 + i * step, yB = yA + step;
      const imp = it.g === 'imp';
      const hR = Math.min(step - 10, 22);
      s += `<line x1="${rx}" y1="${yA}" x2="${rx}" y2="${yA + (step - hR) / 2}" stroke="var(--ink)"/>`;
      s += `<rect x="${rx - 9}" y="${yA + (step - hR) / 2}" width="18" height="${hR}" fill="${imp ? 'var(--accent-soft)' : 'var(--panel)'}" stroke="${imp ? 'var(--accent)' : 'var(--ink)'}" stroke-width="${imp ? 2 : 1}"/>`;
      s += `<line x1="${rx}" y1="${yA + (step + hR) / 2}" x2="${rx}" y2="${yB}" stroke="var(--ink)"/>`;
      const bw = 70 * it.v / tot;
      s += `<rect x="${rx + 165}" y="${yA + step / 2 - 5}" width="${Math.max(bw, 1)}" height="10" fill="${imp ? 'var(--accent)' : 'var(--muted)'}" fill-opacity=".7"/>`;
      s += `<text x="${rx + 16}" y="${yA + step / 2 + 4}" font-size="11.5" fill="var(--ink)">${esc(it.n)}</text>`;
      s += `<text x="${rx + 240}" y="${yA + step / 2 + 4}" font-size="11" class="mono" fill="var(--muted)">${fmt(it.v, 4)} K/W  ΔT ${fmt(it.v * Q, 1)} K</text>`;
      T -= it.v * Q;
      if (i < items.length - 1) s += `<circle cx="${rx}" cy="${yB}" r="2.5" fill="var(--ink)"/>`;
    });
    s += node(rx, ry0 + items.length * step, `T_f,in ${fmt(P.Tin, 1)} °C ${t === 'D' ? '(= T_sat,in)' : ''}`);
    s += `<rect x="${rx + 130}" y="${Hd - 22}" width="12" height="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/><text x="${rx + 148}" y="${Hd - 13}" font-size="11" fill="var(--muted)">필라·제트·비등이 바꾸는 구간</text>`;
    return `<svg viewBox="0 0 ${Wd} ${Hd}" width="100%" style="max-width:${Wd}px" role="img" aria-label="파워모듈 열전달 경로와 열저항망">${s}</svg>`;
    function node(x, y, txt) { return `<circle cx="${x}" cy="${y}" r="5" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5"/><text x="${x - 12}" y="${y + 4}" text-anchor="end" font-size="11.5" class="mono" fill="var(--ink)">${txt}</text>`; }
  }
  function arrow(x1, y1, x2, y2, c, op = 1) {
    const a = Math.atan2(y2 - y1, x2 - x1), L = 7;
    return `<g stroke="${c}" fill="${c}" opacity="${op}"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="2"/><path d="M${x2},${y2} L${x2 - L * Math.cos(a - 0.45)},${y2 - L * Math.sin(a - 0.45)} L${x2 - L * Math.cos(a + 0.45)},${y2 - L * Math.sin(a + 0.45)} Z" stroke="none"/></g>`;
  }
  function stackedBars(rows, P) {
    const keys = [['pkg', '패키지 (다이~접합)', 'var(--muted)'], ['R1D', '냉각기판 전도', '#b8692e'], ['Rsp', '확산', 'var(--cB)'], ['Rconv', '대류', 'var(--accent)'], ['Rcal', '유체 열용량', 'var(--cD)']];
    const vals = rows.map(r => ({ r, v: { pkg: r.R.Rpkg, R1D: r.R.R1D, Rsp: r.R.Rsp, Rconv: r.R.Rconv, Rcal: r.R.Rcal } }));
    const mx = Math.max(...vals.map(x => Object.values(x.v).reduce((a, b) => a + b, 0)));
    const W = 760, lw = 210, bw = W - lw - 70, rh = 24;
    let s = '';
    vals.forEach((x, i) => {
      let xx = lw;
      const y = 10 + i * rh;
      s += `<text x="${lw - 8}" y="${y + 13}" text-anchor="end" font-size="11.5" fill="var(--ink)">${esc(x.r.cs.id)} · ${esc(TYPES[x.r.cs.type].short)} · ${esc(x.r.cs.type === 'REF' ? TC.FLUIDS[x.r.cs.fluid].name : fluidName(x.r.cs))}</text>`;
      keys.forEach(([k, , c]) => { const w = bw * x.v[k] / mx; s += `<rect x="${xx}" y="${y + 3}" width="${Math.max(w, 0)}" height="${rh - 8}" fill="${c}" fill-opacity=".8"/>`; xx += w; });
      s += `<text x="${xx + 6}" y="${y + 13}" font-size="11" class="mono" fill="var(--muted)">${fmt(x.r.Rth, 3)}</text>`;
    });
    const H = 20 + rows.length * rh;
    return `<div class="legend">${keys.map(([, n, c]) => `<span><span class="sw" style="background:${c}"></span>${n}</span>`).join('')}<span class="note">단위 K/W, 막대 끝 숫자 = R_th,j-f</span></div>
      <div class="tblwrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:600px" role="img" aria-label="경우별 열저항 구성">${s}</svg></div>`;
  }
  function renderPath() {
    const { P, res, ref } = S;
    const r = res.find(x => x.cs.id === pathSel) || res[0];
    const rRef = ref;
    const dConv = (1 - r.R.Rconv / rRef.R.Rconv) * 100, dSp = (1 - r.R.Rsp / rRef.R.Rsp) * 100;
    const opts = res.map(x => `<option value="${x.cs.id}" ${x.cs.id === r.cs.id ? 'selected' : ''}>${x.cs.id} · ${esc(x.cs.long)}</option>`).join('');
    $('#v-path').innerHTML = `
      <p class="req">PDF 수행항목 1) 파워모듈의 열원, 패키지, 열확산판, 냉각 표면 및 냉각유체를 포함한 열전달 경로를 그리고, 제트 또는 필라가 열저항망의 어느 구간을 개선하는지 설명한다.</p>
      <div class="card"><div class="row"><label for="pathSel">표시할 경우</label><select id="pathSel">${opts}</select><span class="note">비교 기준: ${modeTxt(P)}</span></div>
      <div class="tblwrap">${stackSVG(r, P)}</div></div>
      <div class="card"><h2>필라·제트가 개선하는 구간</h2>
        <p>칩에서 유체까지 열은 <b>패키지 전도 → 냉각기판 전도·확산 → 대류 → 유체 열용량</b> 순서로 직렬로 흐릅니다. 다이, 접합층, DBC 같은 패키지 층은 모든 경우에 같으므로 냉각안의 차이는 아래 세 구간에서만 생깁니다.</p>
        <div class="expl">
          <div><b>대류 R_conv = 1/(h·A_eff)</b>필라는 젖은 면적 A_eff를 넓히고(핀 효율 η 반영), 제트는 경계층을 얇게 만들어 h를 높입니다. 2상은 비등으로 h를 높입니다. 이 경우 R_conv는 기준(평탄 미세유로) 대비 <b class="num">${fmt(dConv, 0)}%</b> 감소합니다.</div>
          <div><b>확산 R_sp</b>냉각면의 h_eff가 클수록 Biot 수가 커져 열이 칩 바로 아래로 집중되므로 확산저항이 바뀝니다(Lee-Song 식). 기준 대비 <b class="num">${fmt(dSp, 0)}%</b> 변화, Bi = <span class="num">${fmt(r.Bi, 2)}</span>.</div>
          <div><b>유체 열용량 R_cal</b>채널형(A)은 유체가 하류로 갈수록 데워집니다. 제트(B·C)는 칩 위치마다 신선한 유체를 공급해 R_cal과 온도편차를 줄입니다. 2상(D)은 잠열을 쓰므로 유체온도가 포화온도 근처로 유지됩니다.</div>
          <div><b>변하지 않는 구간</b>패키지 합계 <span class="num">${fmt(r.R.Rpkg, 4)} K/W</span>(ΔT ${fmt(r.R.Rpkg * P.common.Q, 1)} K)는 냉각안과 무관합니다. 이 값이 크면 냉각면을 아무리 개선해도 효과가 제한되므로 세라믹·접합재 선정도 함께 봐야 합니다.</div>
        </div></div>
      <div class="card"><h2>경우별 열저항 구성 (같은 비교 기준)</h2>${stackedBars(res.concat([ref]), P)}
        <p class="note">REF(평탄 미세유로)는 필라·제트 없이 같은 채널 높이를 쓴 기준입니다. 개선 효과를 보이기 위한 비교용이며 후보가 아닙니다.</p></div>`;
    $('#pathSel').addEventListener('change', e => { pathSel = e.target.value; renderPath(); });
  }

  // ---------------- 2) 유체 선정표 ----------------
  function renderFluid() {
    const { P } = S;
    const T1 = P.Tin, T2 = P.Tin + 30;
    const used = new Set([P.fluids.sp1]);
    const usedTp = new Set([P.fluids.tp1]);
    const rows = Object.entries(TC.FLUIDS).map(([k, f]) => {
      const a = TC.props1p(f, T1), b = TC.props1p(f, T2);
      const Mo = x => Math.pow(x.rho, 0.8) * Math.pow(x.k, 0.6) * Math.pow(x.cp, 0.4) / Math.pow(x.mu, 0.4);
      const tag = k === P.fluids.sp1 ? '<span class="pill ok">A·B·C 사용</span>' : '';
      return `<tr class="${used.has(k) ? 'best' : ''}"><td><b>${esc(f.name)}</b> ${tag}<div class="note">${esc(f.full)}</div></td>
        <td class="n">${fmt(a.rho, 0)}</td><td class="n">${fmt(a.cp, 0)}</td><td class="n">${fmt(a.k, 3)}</td><td class="n">${fmt(a.mu * 1e3, 2)}<br><span class="note">${fmt(b.mu * 1e3, 2)}</span></td>
        <td class="n">${fmt(a.nu * 1e6, 2)}</td><td class="n">${fmt(a.Pr, 0)}</td><td class="n">${fmt(a.rho * a.cp / 1e6, 2)}</td><td class="n">${fmtS(Mo(a))}</td>
        <td>${esc(f.dielTxt)}</td><td>${esc(f.flash)}</td><td>${esc(f.compat)}</td><td class="note">${f.url ? `<a href="${f.url}">${esc(f.src)}</a>` : esc(f.src)}</td></tr>`;
    }).join('');
    const tprows = Object.entries(TC.TPFLUIDS).map(([k, f]) => {
      const tag = k === P.fluids.tp1 ? '<span class="pill ok">D 사용</span>' : '';
      return `<tr class="${usedTp.has(k) ? 'best' : ''}"><td><b>${esc(f.name)}</b> ${tag}<div class="note">${esc(f.full)}</div></td>
        <td class="n">${fmt(f.Tnb, 1)}</td><td class="n">${fmt(TC.psat(f, P.Tin) / 1e5, 2)}</td><td class="n">${fmt(f.hfg / 1e3, 0)}</td><td class="n">${fmt(f.rhoL, 0)}</td><td class="n">${fmt(TC.rhoV(f, P.Tin), 1)}</td>
        <td class="n">${fmt(f.kL, 3)}</td><td class="n">${fmt(f.muL * 1e3, 2)}</td><td class="n">${fmt(f.sigma * 1e3, 1)}</td><td>${esc(f.dielTxt)} · ${esc(f.gwp)}</td><td>${esc(f.compat)}</td><td class="note">${esc(f.src)}</td></tr>`;
    }).join('');
    $('#v-fluid').innerHTML = `
      <p class="req">PDF 수행항목 2) 절연 냉각유체 후보의 밀도, 비열, 열전도율, 점도, 전기절연 특성, 사용온도 범위, 재료 적합성, 안전자료를 조사하고 출처와 물성치의 온도·압력을 명시한다.</p>
      <div class="card"><h2>냉각안별 절연유체 배정</h2>
        <div class="tblwrap"><table><thead><tr><th>경우</th><th>냉각 구조</th><th>절연 냉각유체</th><th>상</th></tr></thead><tbody>
        ${S.cases.map(cs => `<tr><td>${sw(cs)}<b>${cs.id}</b></td><td>${TYPES[cs.type].name}</td><td>${esc(cs.type === 'D' ? TC.TPFLUIDS[cs.fluid].full : TC.FLUIDS[cs.fluid].full)}</td><td>${cs.type === 'D' ? '2상(비등)' : '단상'}</td></tr>`).join('')}
        </tbody></table></div>
        <p class="note">A·B·C는 같은 단상 유체를 써서 구조 차이만 비교합니다. D는 비등이 필요해 저비점 유체를 쓰고, T_sat,in = T_f,in이 되도록 증발압력을 맞춥니다(PDF 4항). 왼쪽 패널에서 유체를 바꿀 수 있습니다.</p></div>
      ${fluidStudyCard(P)}
      <div class="card"><h2>도구에 입력한 유체 물성 원값과 출처</h2>
        <p>아래는 계산에 실제로 들어간 데이터시트 값입니다. 운전온도의 물성은 이 값으로 보간합니다. 점도는 두 점을 Andrade 식으로 맞추고, 밀도는 기준온도 값에 열팽창계수 β를 적용하며, 비열과 열전도율은 두 점 선형보간을 씁니다. 한 점만 공개된 경우는 일반 탄화수소 온도기울기를 가정했고, 가정한 값은 표에 표시했습니다.</p>
        <div class="tblwrap"><table style="min-width:1100px"><thead><tr><th>유체</th><th>밀도 ρ</th><th>동점도 ν (두 점)</th><th>비열 c_p</th><th>열전도율 k</th><th>인화점</th><th>전기절연</th><th>출처</th></tr></thead><tbody>
        ${Object.entries(TC.FLUIDS).filter(([k]) => k !== 'custom').map(([k, f]) => {
          const nu = f.nuPts || [[40, f.nu40], [100, f.nu100]];
          const rr = f.rhoRef || [25, f.rho25];
          const two = (p, u) => p.map(([t, v]) => `${fmtS(v, 4)}${u} @${t} °C`).join('<br>');
          const one = (v, sl) => `${fmtS(v, 4)} @25 °C<br><span class="note">기울기 ${sl > 0 ? '+' : ''}${(sl * 100).toFixed(2)} %/K (가정)</span>`;
          return `<tr${k === P.fluids.sp1 ? ' class="best"' : ''}><td><b>${esc(f.name)}</b><div class="note">${esc(f.full)}</div></td>
            <td class="mono" style="font-size:12px">${fmtS(rr[1], 4)} kg/m³ @${rr[0]} °C<br><span class="note">β ${(f.beta * 1e4).toFixed(2)}e-4 /K</span></td>
            <td class="mono" style="font-size:12px">${two(nu, ' cSt')}</td>
            <td class="mono" style="font-size:12px">${f.cpPts ? two(f.cpPts, '') : one(f.cp25, f.cpT)}</td>
            <td class="mono" style="font-size:12px">${f.kPts ? two(f.kPts, '') : one(f.k25, f.kT)}</td>
            <td>${esc(f.flash)}</td><td style="font-size:12px">${esc(f.dielTxt)}</td>
            <td class="note">${f.url ? `<a href="${f.url}">${esc(f.src)}</a>` : esc(f.src)}</td></tr>`;
        }).join('')}
        </tbody></table></div>
        <p class="note">단위: c_p J/kg·K, k W/m·K. 초록 줄 = 현재 선택한 유체. AmpCool AC-110의 70 °C 계산값(ν 4.01 cSt)은 NREL 실측값(3.98 cSt, R5)과 0.7% 차이입니다. LANXESS 값은 제조사 웹페이지의 개략값이라 정식 TDS로 다시 확인해야 합니다. 유체명 옆 출처 링크를 누르면 원문이 열립니다.</p></div>
      <div class="card"><h2>단상 절연유체 물성 (T = ${fmt(T1, 0)} °C, 1 atm · 점도 아래 값은 ${fmt(T2, 0)} °C)</h2>
        <div class="tblwrap"><table style="min-width:1250px"><thead><tr><th>유체</th><th class="n">ρ kg/m³</th><th class="n">c_p J/kg·K</th><th class="n">k W/m·K</th><th class="n">μ mPa·s</th><th class="n">ν cSt</th><th class="n">Pr</th><th class="n">ρc_p MJ/m³K</th><th class="n">Mo (난류)</th><th>전기절연</th><th>인화점</th><th>재료 적합성</th><th>출처</th></tr></thead><tbody>${rows}</tbody></table></div>
        <p class="note">Mo = ρ^0.8·k^0.6·c_p^0.4/μ^0.4 (Mouromtseff 수, Dittus-Boelter 기반). 클수록 같은 유속에서 대류 성능이 좋습니다. 점도는 40·100 °C 동점도로 Andrade 식(ln ν = A + B/T)을 맞춰 온도 보간했습니다. ρ, c_p, k는 선형 온도보정입니다.</p></div>
</div>`;
  }

  // ---------------- 3) 구조도·설계변수표 ----------------
  function geoSVG(t, P) {
    const g = P.geo[t], c = P.common, W = 300, H = 170;
    let s = '';
    const lbl = (x, y, txt, a = 'start') => `<text x="${x}" y="${y}" font-size="10.5" fill="var(--muted)" text-anchor="${a}" class="mono">${txt}</text>`;
    const dim = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--muted)" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/>`;
    s += `<defs><marker id="ar" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6 Z" fill="var(--muted)"/></marker></defs>`;
    s += `<text x="4" y="12" font-size="11" font-weight="600" fill="var(--ink)">측면 단면</text><text x="${W / 2 + 14}" y="12" font-size="11" font-weight="600" fill="var(--ink)">평면 배열 (일부)</text>`;
    const bx = 8, by = 26, bw = W / 2 - 52;
    s += `<rect x="${bx}" y="${by}" width="${bw}" height="22" fill="#b8692e" fill-opacity=".85"/>${lbl(bx + 4, by + 15, '냉각기판')}`;
    if (t === 'A') {
      const sc = bw / (4 * g.ST);
      for (let i = 0; i < 4; i++) { const px = bx + (i + 0.5) * g.ST * sc - g.D * sc / 2; s += `<rect x="${px}" y="${by + 22}" width="${g.D * sc}" height="${Math.min(g.H * sc, 90)}" fill="#b8692e" fill-opacity=".7"/>`; }
      const hh = Math.min(g.H * sc, 90);
      s += `<rect x="${bx}" y="${by + 22 + hh}" width="${bw}" height="6" fill="var(--muted)" fill-opacity=".4"/>`;
      s += dim(bx + bw + 6, by + 22, bx + bw + 6, by + 22 + hh) + lbl(bx + bw + 10, by + 26 + hh / 2, 'H=' + fmt(g.H / mm, 2));
      s += dim(bx + 0.5 * g.ST * sc, by + 32 + hh, bx + 1.5 * g.ST * sc, by + 32 + hh) + lbl(bx + g.ST * sc, by + 46 + hh, 'S_T=' + fmt(g.ST / mm, 2), 'middle');
      s += arrow(bx, by + 128, bx + 40, by + 128, 'var(--cool)') + lbl(bx + 46, by + 131, '유동');
      const ox = W / 2 + 14, oy = 26, sc2 = (W / 2 - 24) / (5 * Math.max(g.ST, g.SL));
      for (let j = 0; j < 5; j++) for (let i = 0; i < 5; i++) {
        const off = (g.arr === 'stag' && j % 2) ? g.ST * sc2 / 2 : 0;
        s += `<circle cx="${ox + 10 + j * g.SL * sc2}" cy="${oy + 10 + i * g.ST * sc2 + off}" r="${g.D * sc2 / 2}" fill="#b8692e" fill-opacity=".75"/>`;
      }
      s += arrow(ox, oy + 142, ox + 40, oy + 142, 'var(--cool)') + lbl(ox + 46, oy + 145, (g.arr === 'stag' ? '엇갈림' : '정렬') + ' · D=' + fmt(g.D / mm, 2));
    } else if (t === 'B' || t === 'C') {
      const sc = bw / (2 * g.S);
      if (t === 'C') { const n = Math.floor(2 * g.S / g.Sp); for (let i = 0; i < n; i++) { const px = bx + (i + 0.5) * g.Sp * sc; if (Math.abs(((px - bx) / sc) % g.S - g.S / 2) < g.d) continue; s += `<rect x="${px - g.Dp * sc / 2}" y="${by + 22}" width="${g.Dp * sc}" height="${g.Hpil * sc}" fill="#b8692e" fill-opacity=".7"/>`; } }
      const yn = by + 22 + g.Hj * sc;
      s += `<rect x="${bx}" y="${yn}" width="${bw}" height="${g.ln * sc}" fill="var(--muted)" fill-opacity=".45"/>`;
      for (let i = 0; i < 2; i++) { const nx = bx + (i + 0.5) * g.S * sc; s += `<rect x="${nx - g.d * sc / 2}" y="${yn}" width="${g.d * sc}" height="${g.ln * sc}" fill="var(--panel)"/>` + arrow(nx, yn + g.ln * sc + 14, nx, by + 25 + (t === 'C' ? 0 : 0), 'var(--cool)'); }
      s += dim(bx + bw + 6, by + 22, bx + bw + 6, yn) + lbl(bx + bw + 10, by + 26 + (yn - by - 22) / 2, 'H=' + fmt(g.Hj / mm, 2));
      s += dim(bx + 0.5 * g.S * sc, yn + g.ln * sc + 24, bx + 1.5 * g.S * sc, yn + g.ln * sc + 24) + lbl(bx + g.S * sc, yn + g.ln * sc + 38, 'S=' + fmt(g.S / mm, 2), 'middle');
      const ox = W / 2 + 14, oy = 26, sc2 = (W / 2 - 24) / (3 * g.S);
      if (t === 'C') { const n = Math.floor(3 * g.S / g.Sp); for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) s += `<circle cx="${ox + (i + 0.5) * g.Sp * sc2}" cy="${oy + (j + 0.5) * g.Sp * sc2}" r="${g.Dp * sc2 / 2}" fill="#b8692e" fill-opacity=".55"/>`; }
      for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) s += `<circle cx="${ox + (i + 0.5) * g.S * sc2}" cy="${oy + (j + 0.5) * g.S * sc2}" r="${Math.max(g.d * sc2 / 2, 2)}" fill="var(--cool)"/>`;
      s += lbl(ox, oy + 3 * g.S * sc2 + 14, 'd=' + fmt(g.d / mm, 2) + ' · S=' + fmt(g.S / mm, 2)); if (t === 'C') s += lbl(ox, oy + 3 * g.S * sc2 + 28, 'D_p=' + fmt(g.Dp / mm, 2) + ' · S_p=' + fmt(g.Sp / mm, 2));
    } else {
      const sc = bw / (4 * (g.wc + g.ww));
      for (let i = 0; i < 5; i++) s += `<rect x="${bx + i * (g.wc + g.ww) * sc}" y="${by + 22}" width="${g.ww * sc}" height="${Math.min(g.Hc * sc, 90)}" fill="#b8692e" fill-opacity=".7"/>`;
      const hh = Math.min(g.Hc * sc, 90);
      s += `<rect x="${bx}" y="${by + 22 + hh}" width="${bw}" height="6" fill="var(--muted)" fill-opacity=".4"/>`;
      s += dim(bx + bw + 6, by + 22, bx + bw + 6, by + 22 + hh) + lbl(bx + bw + 10, by + 26 + hh / 2, 'H_c=' + fmt(g.Hc / mm, 2));
      s += lbl(bx, by + 44 + hh, `w_c=${fmt(g.wc / mm, 2)} · w_w=${fmt(g.ww / mm, 2)}`) + lbl(bx, by + 58 + hh, '유동: 지면에 수직');
      const ox = W / 2 + 14, oy = 26;
      for (let i = 0; i < 8; i++) s += `<rect x="${ox}" y="${oy + 6 + i * 15}" width="${W / 2 - 30}" height="${15 * g.ww / (g.wc + g.ww)}" fill="#b8692e" fill-opacity=".7"/>`;
      s += arrow(ox, oy + 135, ox + 40, oy + 135, 'var(--cool)') + lbl(ox + 46, oy + 138, '액체 → 2상');
    }
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:420px;display:block;margin:0 auto 6px" role="img" aria-label="${TYPES[t].name} 구조도">${s}</svg>`;
  }
  function renderGeo() {
    const { P, res } = S;
    const g = P.geo;
    const r = t => res.find(x => x.cs.type === t && x.cs.fi === 1);
    const tblA = () => { const i = r('A').cr.info; return [['필라 직경 D', fmt(g.A.D / mm, 2) + ' mm'], ['필라 높이 H', fmt(g.A.H / mm, 2) + ' mm'], ['피치 S_T × S_L', `${fmt(g.A.ST / mm, 2)} × ${fmt(g.A.SL / mm, 2)} mm`], ['배열', g.A.arr === 'stag' ? '엇갈림' : '정렬'], ['공극률 ε', fmt(i.porosity, 3)], ['H/D (종횡비)', fmt(g.A.H / g.A.D, 2)], ['필라 수 (행×열)', `${i.N} (${i.NL}행)`], ['젖은면적/설치면적', fmt(i.areaRatio, 2)], ['최소 간극', fmt(r('A').cr.minGap / mm, 3) + ' mm'], ['핀 효율 η (끝단 단열)', fmt(r('A').cr.eta, 3)]]; };
    const tblB = () => { const i = r('B').cr.info; return [['노즐 직경 d', fmt(g.B.d / mm, 2) + ' mm'], ['노즐 간격 S', fmt(g.B.S / mm, 2) + ' mm'], ['제트-표면 거리 H', fmt(g.B.Hj / mm, 2) + ' mm'], ['H/d', fmt(i.Hd, 2)], ['S/d', fmt(g.B.S / g.B.d, 2)], ['상대 노즐면적 f', fmt(i.f, 4)], ['노즐 수', `${i.N} (${i.nx}×${i.ny})`], ['노즐 길이', fmt(g.B.ln / mm, 2) + ' mm'], ['배출', g.B.exh === 'side' ? '측면(교차류)' : '분산 회수']]; };
    const tblC = () => { const i = r('C').cr.info; return [['노즐 d / 간격 S', `${fmt(g.C.d / mm, 2)} / ${fmt(g.C.S / mm, 2)} mm`], ['제트-기판 거리 H', fmt(g.C.Hj / mm, 2) + ' mm'], ['제트-필라끝 거리', fmt((g.C.Hj - g.C.Hpil) / mm, 2) + ' mm'], ['필라 D_p / H_p', `${fmt(g.C.Dp / mm, 2)} / ${fmt(g.C.Hpil / mm, 2)} mm`], ['필라 피치 S_p', fmt(g.C.Sp / mm, 2) + ' mm'], ['필라 공극률', fmt(i.porosity, 3)], ['노즐 수 / 필라 수', `${i.N} / ${i.Np}`], ['젖은면적/설치면적', fmt(i.areaRatio, 2)], ['감쇠계수 χ', fmt(g.C.chi, 2)], ['보정 핀 길이 L_c', fmt(i.Lc / mm, 2) + ' mm'], ['핀 효율 η', fmt(r('C').cr.eta, 3)]]; };
    const tblD = () => { const i = r('D').cr.info; return [['채널 폭 w_c', fmt(g.D.wc / mm, 2) + ' mm'], ['벽 두께 w_w', fmt(g.D.ww / mm, 2) + ' mm'], ['채널 높이 H_c', fmt(g.D.Hc / mm, 2) + ' mm'], ['종횡비 H_c/w_c', fmt(g.D.Hc / g.D.wc, 2)], ['수력직경 D_h', fmt(i.Dh / mm, 3) + ' mm'], ['채널 수', i.N], ['젖은면적/설치면적', fmt(i.areaRatio, 2)], ['작동압력 (D-1)', fmt(r('D').cr.tp.Pin / 1e5, 2) + ' bar']]; };
    const card = (t, rows, op) => `<div class="card"><h3><span class="sw" style="background:${TYPES[t].color}"></span>${t}. ${TYPES[t].name}</h3>${geoSVG(t, P)}
      <table><tbody>${rows.map(([k, v]) => `<tr><td>${k}</td><td class="n">${v}</td></tr>`).join('')}</tbody></table>
      <p class="note" style="margin-top:6px">운전조건(${modeTxt(P)}): ${op}</p></div>`;
    const opTxt = t => [1].map(i => { const x = res.find(z => z.cs.type === t && z.cs.fi === i); return `${x.cs.id} ${esc(fluidName(x.cs))} V̇=${fmt(x.V * 6e4, 3)} L/min, Δp=${fmt(x.dp / 1e3, 1)} kPa`; }).join(' / ');
    $('#v-geo').innerHTML = `
      <p class="req">PDF 수행항목 3) 선택한 냉각안의 형상과 운전조건을 정하고 열·유동 계산을 수행한다. 필라 배열은 직경, 높이, 피치, 배열, 공극률을, 제트는 노즐 직경, 간격, 제트-표면 거리를 제시한다. (제출물: 냉각 구조도, 필라/제트 설계변수표)</p>
      <div class="grid2">${card('A', tblA(), opTxt('A'))}${card('B', tblB(), opTxt('B'))}${card('C', tblC(), opTxt('C'))}</div>
      <div class="card"><h3>공통 패키지 조건</h3><div class="tblwrap"><table><thead><tr><th>층</th><th class="n">두께 mm</th><th class="n">k W/m·K</th><th class="n">R K/W</th></tr></thead><tbody>
      ${res[0].R.layers.map(l => `<tr><td>${esc(l.name)}</td><td class="n">${fmt(l.t / mm, 2)}</td><td class="n">${fmt(l.k, 0)}</td><td class="n">${fmt(l.R, 4)}</td></tr>`).join('')}
      <tr><td>냉각기판 (${TC.MAT[P.common.baseMat].name})</td><td class="n">${fmt(P.common.tBase / mm, 2)}</td><td class="n">${fmt(P.common.kBase, 0)}</td><td class="n">1D ${fmt(res[0].R.R1D, 4)}</td></tr>
      </tbody></table></div><p class="note">칩 ${fmt(P.common.chipL / mm, 1)}×${fmt(P.common.chipW / mm, 1)} mm, 설치면적 ${fmt(P.common.L / mm, 1)}×${fmt(P.common.W / mm, 1)} mm, 칩 열유속 ${fmt(P.common.Q / (P.common.chipL * P.common.chipW) / 1e4, 0)} W/cm².</p></div>`;
  }

  // ---------------- 4) 공정 비교표 ----------------
  function cmpTable(rows, title, P, note) {
    const bestG = (g) => bestBy(rows.filter(g), r => r.Tj);
    const b1 = bestG(r => r.cs.type !== 'D' && r.cs.fi === 1), b2 = bestG(r => r.cs.type !== 'D' && r.cs.fi === 2), bD = bestG(r => r.cs.type === 'D');
    const isBest = r => r === b1 || r === b2 || r === bD;
    const body = rows.map(r => {
      const tp = r.cs.type === 'D' ? r.cr.tp : null;
      return `<tr class="${isBest(r) ? 'best' : ''}"><td style="white-space:nowrap">${sw(r.cs)}<b>${r.cs.id}</b></td><td style="white-space:nowrap">${TYPES[r.cs.type].short}</td><td style="white-space:nowrap">${esc(fluidName(r.cs))}</td>
        <td class="n">${fmt(r.V * 6e4, 3)}</td><td class="n">${fmt(r.mdot * 1e3, 2)}</td><td class="n">${fmtS(r.cr.Re)}</td><td class="n">${fmtS(r.cr.h)}</td><td class="n">${fmtS(r.cr.heff)}</td>
        <td class="n">${fmt(r.dp / 1e3, 2)}</td><td class="n">${fmt(r.W, 3)}</td><td class="n">${tp ? 'x=' + fmt(tp.xout, 2) : fmt(r.Tout, 1)}</td>
        <td class="n"><b>${fmt(r.Tj, 1)}</b><div class="note">175 °C 대비 ${fmt(175 - r.Tj, 0)} K 여유</div></td><td class="n">${fmt(r.dev, 1)}</td><td class="n">${fmt(r.Rth, 3)}</td><td class="n">${fmt(r.Rth * P.common.chipL * P.common.chipW * 1e6, 1)}</td><td class="n">${fmt(r.cr.uniform * 100, 0)}%</td><td style="white-space:nowrap">${warnPill(r)}</td></tr>`;
    }).join('');
    return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${title}</h2><button class="btn" data-csv="${esc(title)}">표 복사 (CSV)</button></div>
      <div class="tblwrap"><table><thead><tr><th>경우</th><th>냉각 구조</th><th>절연유체</th><th class="n">유량 L/min</th><th class="n">ṁ g/s</th><th class="n">Re</th><th class="n">h W/m²K</th><th class="n">h_eff W/m²K</th><th class="n">Δp kPa</th><th class="n">W_pump W</th><th class="n">T_out °C</th><th class="n">T_j,max °C</th><th class="n">ΔT_칩 K</th><th class="n">R_th,j-f K/W</th><th class="n">R'' mm²K/W</th><th class="n">유량균일도</th><th>상태</th></tr></thead><tbody>${body}</tbody></table></div>
      <p class="note">${note} 초록 줄 = 최저 T_j. R'' = R_th × 칩 면적(논문과 같은 비열저항 정의). h_eff는 설치면적 기준 유효 열전달계수(핀 효율·면적 증가 포함). ΔT_칩은 유체 온도상승·h 분포·포화온도 강하로 추정한 1차 값입니다.</p></div>`;
  }
  function chartSVG(o) {
    const W = 760, H = 330, ml = 58, mr = 16, mt = 14, mb = 44;
    const all = o.series.flatMap(s => s.pts).filter(p => isFinite(p[0]) && isFinite(p[1]) && (!o.xlog || p[0] > 0));
    if (!all.length) return '<p class="note">표시할 점이 없습니다.</p>';

    const tx = v => o.xlog ? Math.log10(v) : v, ty = v => o.ylog ? Math.log10(v) : v;

    ticks(y0, y1, o.ylog).forEach(v => { s += `<line x1="${ml}" y1="${Y(v)}" x2="${W - mr}" y2="${Y(v)}" stroke="var(--line)"/><text x="${ml - 6}" y="${Y(v) + 4}" font-size="10.5" text-anchor="end" class="mono" fill="var(--muted)">${fmtS(v, 3)}</text>`; });
    s += `<text x="${(ml + W - mr) / 2}" y="${H - 8}" font-size="11.5" text-anchor="middle" fill="var(--ink)">${o.xlabel}</text>`;
    s += `<text x="14" y="${(mt + H - mb) / 2}" font-size="11.5" text-anchor="middle" fill="var(--ink)" transform="rotate(-90 14 ${(mt + H - mb) / 2})">${o.ylabel}</text>`;
    if (o.vline && o.vline > x0 && o.vline < x1) s += `<line x1="${X(o.vline)}" y1="${mt}" x2="${X(o.vline)}" y2="${H - mb}" stroke="var(--ink)" stroke-dasharray="4 3" opacity=".6"/><text x="${X(o.vline) + 4}" y="${mt + 11}" font-size="10.5" fill="var(--ink)">비교 기준</text>`;
    s += `<clipPath id="cp${o.id}"><rect x="${ml}" y="${mt}" width="${W - ml - mr}" height="${H - mt - mb}"/></clipPath><g clip-path="url(#cp${o.id})">`;
    o.series.forEach(se => {
      const pts = se.pts.filter(p => isFinite(p[0]) && isFinite(p[1]) && (!o.xlog || p[0] > 0) && (!o.ylog || p[1] > 0));

  }
  function niceStep(x) { const e = Math.floor(Math.log10(x)), f = x / 10 ** e; return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * 10 ** e; }

        <dt>열성능</dt><dd class="num">T_j,max ${fmt(wr.Tj, 1)} °C · R_th,j-f ${fmt(wr.Rth, 3)} K/W · ΔT_칩 ${fmt(wr.dev, 1)} K</dd>

        <dt>점수 약점</dt><dd>${strengths.filter(x => x.d < -0.05).slice(-3).map(x => x.c.name).join(', ') || '평균 이하 항목 없음'}</dd></dl></div>

  // ---------------- 스윕 ----------------
  const SWEEP = {
    A: [['D', '필라 직경 D', 0.2, 1.0], ['H', '필라 높이 H', 0.3, 3.0], ['ST', '피치 S_T=S_L', 0.5, 2.5]],
    B: [['d', '노즐 직경 d', 0.2, 1.5], ['S', '노즐 간격 S', 1.0, 6.0], ['Hj', '제트-표면 거리 H', 0.3, 5.0]],
    C: [['d', '노즐 직경 d', 0.2, 1.2], ['S', '노즐 간격 S', 1.2, 5.0], ['Hj', '제트-기판 거리 H', 0.9, 4.0], ['Dp', '필라 직경 D_p', 0.15, 0.6], ['Hpil', '필라 높이 H_p', 0.2, 1.4], ['Sp', '필라 피치 S_p', 0.4, 1.6]],
    D: [['wc', '채널 폭 w_c', 0.1, 1.0], ['ww', '벽 두께 w_w', 0.1, 0.6], ['Hc', '채널 높이 H_c', 0.3, 3.0]]
  };
  let sw_case = 'A', sw_par = 'D', sw_min = 0.2, sw_max = 1.0;
  function renderSweep() {
    const { P, cases } = S;
    const cs = cases.find(c => c.id === sw_case) || cases[0];
    const plist = SWEEP[cs.type];
    if (!plist.some(p => p[0] === sw_par)) { sw_par = plist[0][0]; sw_min = plist[0][2]; sw_max = plist[0][3]; }
    const pts = [], dpp = [];
    const base = P.geo[cs.type][sw_par] / mm;
    for (let i = 0; i <= 24; i++) {
      const v = sw_min + (sw_max - sw_min) * i / 24;
      const P2 = JSON.parse(JSON.stringify(P));
      P2.geo[cs.type][sw_par] = v * mm;
      if (sw_par === 'ST') P2.geo.A.SL = v * mm;
      const g = P2.geo[cs.type];
      if ((cs.type === 'A' && g.D >= Math.min(g.ST, g.SL) * 0.95) || (cs.type === 'C' && (g.Dp >= g.Sp * 0.95 || g.Hj <= g.Hpil + 0.05 * mm))) continue;
      const r = TC.solve(cs, P2, P2.mode, P2.target);
      if (!r.feasible) continue;
      pts.push([v, r.Tj]);
      dpp.push([v, P.mode === 'power' ? r.dp / 1e3 : r.W]);
    }
    const cur = TC.solve(cs, P, P.mode, P.target);
    const opt = pts.reduce((b, p) => (!b || p[1] < b[1]) ? p : b, null);
    const c1 = chartSVG({ id: 's1', series: [{ name: `${cs.id} T_j,max`, color: caseColor(cs), pts, mark: [base, cur.Tj] }], xlabel: `${plist.find(p => p[0] === sw_par)[1]} [mm]`, ylabel: 'T_j,max [°C]', vline: base });
    const c2 = chartSVG({ id: 's2', series: [{ name: P.mode === 'power' ? 'Δp [kPa]' : 'W_pump [W]', color: 'var(--muted)', pts: dpp }], xlabel: `${plist.find(p => p[0] === sw_par)[1]} [mm]`, ylabel: P.mode === 'power' ? 'Δp [kPa]' : 'W_pump [W]', vline: base });
    $('#v-sweep').innerHTML = `
      <p class="req">형상 결정 보조: 한 변수를 바꾸며 같은 비교 기준(${modeTxt(P)})에서 T_j,max와 압력·동력을 계산합니다. 필라 간격을 줄이면 면적은 늘지만 압력강하와 막힘 위험이 커지는 절충(PDF 고려사항)을 확인하는 데 씁니다.</p>
      <div class="card"><div class="row">
        <label for="swCase">경우</label><select id="swCase">${cases.map(c => `<option value="${c.id}" ${c.id === cs.id ? 'selected' : ''}>${c.id} · ${esc(c.long)}</option>`).join('')}</select>
        <label for="swPar">변수</label><select id="swPar">${plist.map(p => `<option value="${p[0]}" ${p[0] === sw_par ? 'selected' : ''}>${p[1]}</option>`).join('')}</select>
        <label for="swMin">최소 mm</label><input id="swMin" type="number" step="any" value="${sw_min}" style="width:70px">
        <label for="swMax">최대 mm</label><input id="swMax" type="number" step="any" value="${sw_max}" style="width:70px"></div>
        <p class="note">현재값 ${fmt(base, 2)} mm (점선). 이 범위의 최저 T_j: ${opt ? `${fmt(opt[0], 2)} mm에서 ${fmt(opt[1], 1)} °C` : '–'}. 기하학적으로 불가능한 점(필라가 겹침 등)과 건조가 발생한 점은 제외했습니다.</p>
        <div class="grid2"><div>${c1}</div><div>${c2}</div></div></div>`;
    $('#swCase').addEventListener('change', e => { sw_case = e.target.value; const t = e.target.value[0]; sw_par = SWEEP[t][0][0]; sw_min = SWEEP[t][0][2]; sw_max = SWEEP[t][0][3]; renderSweep(); });
    $('#swPar').addEventListener('change', e => { sw_par = e.target.value; const p = SWEEP[cs.type].find(x => x[0] === sw_par); sw_min = p[2]; sw_max = p[3]; renderSweep(); });
    $('#swMin').addEventListener('change', e => { sw_min = parseFloat(e.target.value) || sw_min; renderSweep(); });
    $('#swMax').addEventListener('change', e => { sw_max = parseFloat(e.target.value) || sw_max; renderSweep(); });
  }

  // ---------------- 가정·한계 ----------------
  function renderNotes() {
    $('#v-notes').innerHTML = `
      <div class="card"><h2>계산 방법 요약</h2>

        <dt>패키지</dt><dd>층별 1D 전도, 45° 열확산 근사로 층마다 면적 증가: R = t/(k·√(A_top·A_bot))</dd>

        <dt>C 복합</dt><dd>필라 끝까지 거리로 Martin h 계산 × 감쇠계수 χ → 필라 면적·핀 효율 반영 / 노즐 손실 + 필라 사이 반경방향 통과 손실(Gaddis). 필라 핀 효율은 보정 길이 L_c = H_p + D_p/4로 끝단(윗면) 대류를 근사(윗면과 옆면에 같은 h 가정)</dd>
        <dt>D 2상</dt><dd>Kim &amp; Mudawar (2013) 미니·마이크로채널 포화 유동비등(평균 건도) / 균질류 마찰 + 가속 압력강하 / Qu &amp; Mudawar (2004) CHF / 포화온도 강하를 온도편차로 반영</dd>
        <dt>펌프동력</dt><dd>W_pump = Δp·V̇/η_pump. 유체 열수송 Q̇ = ṁ·c_p·ΔT(단상), Q̇ = ṁ·Δh = ṁ·x·h_fg(2상)</dd>
        <dt>R_cal</dt><dd>채널형(A·REF): (0.5 + 0.5·L_chip/L)/(ṁc_p), 칩 하류부 유체온도 반영. 분산 배출 제트: 0.1/(ṁc_p), 측면 배출: 0.3/(ṁc_p)</dd>
        <dt>유량균일도</dt><dd>1 − ½·(헤더·플레넘 동압)/(코어 압력강하). 분배부 동압이 작을수록 균일</dd>
      </dl></div>
      <div class="card"><h2>한계 (보고서에 명시 권장)</h2><ul class="tight">
        <li>모든 상관식은 문헌의 특정 치수·유체·Re 범위에서 얻어졌습니다. 절연유체는 점도가 높아 Re가 낮으므로 Martin 식(Re ≥ 2000)은 외삽입니다. PDF가 경고한 대로 문헌의 성능 향상을 그대로 가정하지 말고 CFD나 시험으로 확인해야 합니다.</li>
        <li>Zukauskas 식은 긴 관군 기준이라 H/D가 작은 마이크로 핀핀에서는 h를 과대평가할 수 있습니다(Kosar &amp; Peles 등 마이크로 핀핀 상관식과 비교 권장).</li>

      </ul></div>`;
  }

  // ---------------- 예비설계 산출물 (A·B·C 선택) ----------------
  const sb = t => `<sub>${t}</sub>`;
  const ts = (b, s, rest = '') => `${b}<tspan baseline-shift="sub" font-size="75%">${s}</tspan>${rest}`;
  const TJ_LIM = 175, TJ_MARGIN = 25;
  let adSel = 'A';
  const subFix = x => x.replace(/([A-Za-zχηε])_([A-Za-z0-9]+(?:,[A-Za-z0-9]+)?)/g, '$1<sub>$2</sub>');
  function adevSVG(P, r, t) {
    const c = P.common, g = P.geo[t], info = r.cr.info;
    const Wd = 880, xs0 = 150, xw = 420, sx = xw / c.L, cx = xs0 + xw / 2;
    const cw = Math.max(40, c.chipL * sx);
    let s = `<defs><marker id="adm" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6 Z" fill="var(--muted)"/></marker></defs>`;
    const T = (x, y, txt, o = {}) => `<text x="${x}" y="${y}" font-size="${o.fs || 11}" ${o.a ? `text-anchor="${o.a}"` : ''} ${o.w ? `font-weight="${o.w}"` : ''} fill="${o.c || 'var(--ink)'}" ${o.mono ? 'class="mono"' : ''}>${txt}</text>`;
    const dimH = (x1, x2, y) => `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="var(--muted)" marker-start="url(#adm)" marker-end="url(#adm)"/>`;
    const dimV = (x, y1, y2) => `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="var(--muted)" marker-start="url(#adm)" marker-end="url(#adm)"/>`;
    const CU = '#b8692e';
    s += T(20, 20, '유동 방향 단면 (층 두께는 비례 아님, 가로 방향은 실제 비율)', { fs: 12, w: 600 });
    const L = c.layers;
    const vis = [
      [L[0], cw, 22, 'var(--heat)', .85], [L[1], cw, 6, '#9aa5b1', 1], [L[2], cw + 30, 12, '#c77d3a', 1],
      [L[3], cw + 50, 14, '#dde2e6', 1], [L[4], cw + 50, 12, '#c77d3a', 1], [L[5], cw + 50, 6, '#9aa5b1', 1]
    ];
    let y = 48;
    const lab = [];
    vis.forEach(([ly, w, h, col, op]) => {
      s += `<rect x="${cx - w / 2}" y="${y}" width="${w}" height="${h}" fill="${col}" fill-opacity="${op}" stroke="var(--ink)" stroke-opacity=".35"/>`;
      lab.push([cx + w / 2, y + h / 2, `${esc(ly.name)} · ${fmt(ly.t / mm, 2)} mm, k ${fmt(ly.k, 0)}`]);
      y += h;
    });
    const yb = y, hb = 30;
    s += `<rect x="${xs0}" y="${yb}" width="${xw}" height="${hb}" fill="${CU}" fill-opacity=".9" stroke="var(--ink)" stroke-opacity=".35"/>`;
    lab.push([xs0 + xw, yb + hb / 2, `열확산판·냉각기판 (${TC.MAT[c.baseMat].name}) · ${fmt(c.tBase / mm, 2)} mm`]);
    lab.forEach(([x0, y0, tt], i) => {
      const ly = 50 + i * 16;
      s += `<polyline points="${x0 + 2},${y0} ${Math.max(x0 + 10, 588)},${ly - 4} 596,${ly - 4}" fill="none" stroke="var(--muted)" stroke-width=".8"/>` + T(600, ly, tt, { fs: 10.5 });
    });
    s += T(cx, 42, `칩 발열 Q = ${fmtS(c.Q)} W (${fmt(c.Q / (c.chipL * c.chipW) / 1e4, 0)} W/cm²)`, { a: 'middle', fs: 10.5, w: 600, c: 'var(--heat)' });
    const yc = yb + hb;
    let ybot, xp, pw, kD, dimLab;
    if (t === 'A') {
      const hc = 90;
      s += `<rect x="${xs0}" y="${yc}" width="${xw}" height="${hc}" fill="var(--cool)" fill-opacity=".12"/>`;
      const NL = info.NL, pitch = g.SL * sx; pw = Math.max(2, g.D * sx);
      xp = k => xs0 + (k + 0.5) * pitch;
      for (let k = 0; k < NL; k++) s += `<rect x="${xp(k) - pw / 2}" y="${yc}" width="${pw}" height="${hc}" fill="${CU}" fill-opacity=".8"/>`;
      s += `<rect x="${xs0}" y="${yc + hc}" width="${xw}" height="12" fill="var(--muted)" fill-opacity=".45" stroke="var(--ink)" stroke-opacity=".3"/>`;
      s += arrow(70, yc + hc - 14, xs0 - 2, yc + hc - 14, 'var(--cool)') + arrow(xs0 + xw + 2, yc + hc - 14, xs0 + xw + 58, yc + hc - 14, 'var(--hot)');
      for (let k = 0; k < Math.min(NL - 1, 6); k++) { const xa = xp(k * Math.max(1, Math.floor(NL / 6))) + pw / 2 + 2; s += arrow(xa, yc + 30, xa + Math.max(pitch - pw - 6, 6), yc + 30, 'var(--cool)', .6); }
      s += T(16, yc + hc - 44, '입구', { w: 600 }) + T(16, yc + hc - 30, ts('T', 'in', ` = ${fmt(P.Tin, 1)} °C`), { fs: 10.5, mono: 1 }) + T(16, yc + hc + 8, `V̇ = ${fmt(r.V * 6e4, 3)} L/min`, { fs: 10.5, mono: 1 });
      s += T(xs0 + xw + 64, yc + hc - 10, ts('출구 T', 'out', ` = ${fmt(r.Tout, 1)} °C`), { fs: 10.5 });
      s += T(600, yc + 22, `마이크로필라 (기판과 일체 가공, ${g.arr === 'stag' ? '엇갈림' : '정렬'})`, { fs: 10.5 });
      s += T(600, yc + 40, `H = ${fmt(g.H / mm, 2)} mm (= 유로 높이)`, { fs: 10.5, mono: 1 });
      s += T(600, yc + hc + 10, '커버 (필라 끝 밀착, 우회 없음)', { fs: 10.5 });

      ybot = yc + hc + 12; kD = Math.min(3, NL - 1);

    } else {
      const hj = 56, hpl = 14, hpn = 40;
      const yn = yc + hj;
      s += `<rect x="${xs0}" y="${yc}" width="${xw}" height="${hj}" fill="var(--cool)" fill-opacity=".12"/>`;
      s += `<rect x="${xs0}" y="${yn + hpl}" width="${xw}" height="${hpn}" fill="var(--cool)" fill-opacity=".2"/>`;
      const nx = info.nx, pitch = g.S * sx; pw = Math.max(3, g.d * sx);

        if (g.exh !== 'side' || t === 'C') { s += arrow(xp(k) - 3, yc + 10, xp(k) - Math.min(pitch / 2 - 4, 30), yc + 22, 'var(--hot)', .6) + arrow(xp(k) + 3, yc + 10, xp(k) + Math.min(pitch / 2 - 4, 30), yc + 22, 'var(--hot)', .6); }

      s += T(16, yn + 4, '입구 (플레넘)', { w: 600 }) + T(16, yn + 20, ts('T', 'in', ` = ${fmt(P.Tin, 1)} °C`), { fs: 10.5, mono: 1 }) + T(16, yn + hpl + hpn + 12, `V̇ = ${fmt(r.V * 6e4, 3)} L/min`, { fs: 10.5, mono: 1 });
      s += T(xs0 + xw + 64, yc + 30, ts('출구 T', 'out', ` = ${fmt(r.Tout, 1)} °C`), { fs: 10.5 });
      s += T(600, yc + hj - 12, `제트-${t === 'C' ? '기판' : '표면'} 거리 H = ${fmt(g.Hj / mm, 2)} mm`, { fs: 10.5, mono: 1 });
      s += T(600, yn + 11, `노즐판 (d = ${fmt(g.d / mm, 2)} mm, 길이 ${fmt(g.ln / mm, 2)} mm)`, { fs: 10.5 });
      s += T(600, yn + hpl + hpn / 2 + 18, `공급 플레넘 (높이 ${fmt(g.Hp / mm, 1)} mm)`, { fs: 10.5 });

    const kd2 = t === 'A' ? kD : 2;

    s += dimH(cx - cw / 2, cx + cw / 2, yd + 26) + T(cx, yd + 40, `칩 길이 ${fmt(c.chipL / mm, 1)} mm`, { a: 'middle', fs: 10.5, c: 'var(--heat)' });
    s += dimH(xs0, xs0 + xw, yd + 52) + T(cx, yd + 66, `설치 면적 길이 L = ${fmt(c.L / mm, 1)} mm`, { a: 'middle', fs: 10.5 });

    s += arrow(px0, ph0 + c.W * s2 + 16, px0 + 60, ph0 + c.W * s2 + 16, 'var(--cool)') + T(px0 + 66, ph0 + c.W * s2 + 20, t === 'A' ? '유동 방향' : '배출 방향', { fs: 10.5 });

    const lx = 340, ly0 = py0 + 10;

      ['<line x1="0" y1="5" x2="14" y2="5" stroke="var(--heat)" stroke-width="2"/>', t === 'A' ? '열 흐름: 칩 → 패키지 → 확산판 → 필라 → 유체' : '열 흐름: 칩 → 패키지 → 확산판 → 충돌면 → 유체'],
      ['<line x1="0" y1="5" x2="14" y2="5" stroke="var(--cool)" stroke-width="2"/>', t === 'A' ? '유체 흐름: 입구 → 필라 사이 → 출구' : '유체 흐름: 플레넘 → 노즐 → 충돌 → 배출'],

    const yk = ly0 + leg.length * 20 + 14;
    const kv = t === 'A'
      ? [[`필라 ${info.N}개 (${info.NT} × ${info.NL})`, `공극률 ε = ${fmt(info.porosity, 3)}`], [`젖은 면적비 = ${fmt(info.areaRatio, 2)}`, `유체: ${esc(TC.FLUIDS[r.cs.fluid].name)}`]]

    kv.push([`Δp = ${fmt(r.dp / 1e3, 2)} kPa`, ts('T', 'j,max', ` = ${fmt(r.Tj, 1)} °C`)]);
    kv.forEach(([a, b], i) => { s += T(lx, yk + i * 18, a, { fs: 11, mono: 1 }) + T(lx + 260, yk + i * 18, b, { fs: 11, mono: 1 }); });
    const Hn = Math.max(ph0 + c.W * s2 + 30, yk + kv.length * 18 + 6);

  }

        vrow('유동방향 피치', `S${sb('L')}`, fmt(g.SL / mm, 2), 'mm', `b = S${sb('L')}/D ≥ 1.25`, ok(b >= 1.25, '범위 내', '범위 밖')),

        vrow('헤더 높이', `H${sb('hdr')}`, fmt(g.Hhdr / mm, 1), 'mm', '클수록 분배 균일 (유량 균일도)', ''),

        vrow('종횡비', 'H/D', fmt(HD, 2), '–', '2 미만이면 끝벽 효과로 상관식 오차 큼', HD >= 2 ? ok(true, '양호') : warnP('오차 주의')),

        vrow('젖은 면적비', `A${sb('wet')}/(L·W)`, fmt(i.areaRatio, 2), '–', '평탄면 대비 면적 증가 배수', ''),
        vrow('최소 간극', `g${sb('min')}`, fmt(gap / mm, 3), 'mm', '0.15 mm 미만이면 막힘 위험', ok(gap >= 0.15e-3, '양호', '막힘 위험')));

        vrow('필라 피치 (정렬)', `S${sb('p')}`, fmt(g.Sp / mm, 2), 'mm', '', ''),
        vrow('벽면제트 감쇠계수', 'χ', fmt(g.chi, 2), '–', '가정값 (문헌·CFD 보정 필요)', warnP('가정값')));

        <p>${t === 'A' ? '칩에서 나온 열은 패키지와 열확산판을 지나 필라 표면에서 절연유체로 넘어갑니다. 유체는 입구에서 필라 사이를 지나 출구로 나가며, 커버가 필라 끝을 막아 우회 유동이 없습니다.'
          : t === 'B' ? '유체는 공급 플레넘에서 노즐판을 지나 제트로 냉각기판 바닥에 부딪힙니다. 충돌점의 얇은 경계층이 열을 빠르게 가져가고, 데워진 유체는 ' + (P.geo.B.exh === 'side' ? '측면으로 배출됩니다.' : '노즐 사이로 회수됩니다.')
          : '제트가 필라 사이 바닥에 부딪힌 뒤 필라 사이로 퍼져 나갑니다. 제트의 높은 h와 필라의 넓은 면적을 함께 씁니다. 제트 축 바로 아래에는 필라를 두지 않습니다.'}</p>
        ${adevSVG(P, rX, t)}
        <h3 style="margin-top:10px">열전달 경로와 ${t}안이 바꾸는 구간</h3>
        <div class="tblwrap"><table><thead><tr><th>구간</th><th>경로</th><th>기호</th><th class="n">R K/W</th><th class="n">ΔT K</th><th class="n">비율</th><th>${t}안이 바꾸나</th></tr></thead><tbody>${pathRows}
        <tr class="best"><td colspan="3"><b>합계 R${sb('th,j-f')}</b> → T${sb('j,max')} = T${sb('in')} + Q·R${sb('th')}</td><td class="n"><b>${fmt(Rt, 4)}</b></td><td class="n"><b>${fmt(Rt * Q, 1)}</b></td><td class="n">100%</td><td>T${sb('j,max')} = <b>${fmt(rX.Tj, 1)} °C</b></td></tr></tbody></table></div>
        <p class="note">대류 저항은 같은 조건의 평탄 미세유로(기준) 대비 ${fmt(dConv, 0)}% ${dConv >= 0 ? '작습니다' : '큽니다'}.</p></div>

      <div class="card" id="ad-2"><h2>② 공정 비교표</h2>
        <p>같은 칩 발열량, 유체, 입구온도, 설치 면적, 패키지 조건에서 비교했습니다. 기본 비교 기준은 ${modeTxt(P)}이고, 초록 줄이 선택한 ${t}안입니다.</p>
        <div class="tblwrap"><table><thead><tr><th>경우</th><th>냉각 구조</th><th class="n">유량 L/min</th><th class="n">압력강하 kPa</th><th class="n">펌프동력 W</th><th class="n">최고온도 T${sb('j,max')} °C</th><th class="n">온도편차 K</th><th class="n">열저항 R${sb('th,j-f')} K/W</th><th class="n">R″ mm²K/W</th><th class="n">유량 균일도</th><th class="n">${t} 대비 T${sb('j')}</th></tr></thead><tbody>${cmpRows}</tbody></table></div>
        <h3 style="margin-top:10px">비교 기준을 바꿔도 ${t}안의 위치는?</h3>
        <div class="tblwrap"><table><thead><tr><th>비교 기준</th>${all.map(r => `<th class="n">${r.cs.id} T${sb('j')} °C</th>`).join('')}<th class="n">${t} 순위 (A·B·C)</th></tr></thead><tbody>${modeRows}</tbody></table></div>
        <p class="note">R″ = R${sb('th')} × 칩 면적. 기준(REF)은 필라·제트 없는 평탄 미세유로로, 후보가 아니라 개선 효과를 보이기 위한 비교 대상입니다.</p></div>

      <div class="card" id="ad-3"><h2>③ ${delivs[2][0]}</h2>
        <p>${t === 'A' ? 'A안은 필라 배열이므로 필라 치수·피치·공극률을 제시합니다.' : t === 'B' ? 'B안은 제트이므로 노즐 치수·간격·제트-표면 거리를 제시합니다.' : 'C안은 제트와 필라를 함께 쓰므로 노즐 변수와 필라 변수를 모두 제시합니다.'} 판정은 상관식 적용범위와 제작·막힘 기준입니다.</p>
        <div class="tblwrap"><table><thead><tr><th>변수</th><th>기호</th><th class="n">값</th><th>단위</th><th>정의·결정 근거</th><th>판정</th></tr></thead><tbody>${varRows}</tbody></table></div></div>

      <div class="card" id="ad-4"><h2>④ 유체 선정표</h2>
        <p>후보 유체마다 ${t}안 형상을 그대로 두고 같은 비교 기준(${modeTxt(P)})으로 다시 계산했습니다. 물성은 T${sb('in')} = ${fmt(P.Tin, 0)} °C, 1 atm 값입니다.</p>
        <div class="tblwrap"><table style="min-width:1150px"><thead><tr><th>유체</th><th class="n">ρ kg/m³</th><th class="n">c${sb('p')} J/kg·K</th><th class="n">k W/m·K</th><th class="n">μ mPa·s</th><th class="n">Pr</th><th>절연성</th><th>재료 적합성</th><th>안전성</th><th class="n">사용조건 (유량·Δp·온도)</th><th class="n">${t}안 T${sb('j,max')} °C</th><th>출처</th></tr></thead><tbody>${fluidRows}</tbody></table></div>
        <p class="note">초록 줄 = 현재 선택 유체. 물-EG 50%는 전도성이라 직접냉각에 쓸 수 없으며 비교용으로만 표시했습니다. 동일 펌프동력 비교에서는 점도가 낮은 유체가 더 많은 유량을 흘려 유리합니다.</p></div>

      <div class="card" id="ad-5"><h2>⑤ 선정 근거 · ${t}안</h2>
        <h3>판단순서</h3>
        <div class="stps">
          ${step(1, '조건 고정', ok(true, '공통 조건'))}
          ${step(2, '필수조건 판정', ok(passX, `${t} 합격`, `${t} 불합격`))}
          ${step(3, '가중 점수', rankX === 1 ? ok(true, `${t} 1위`) : warnP(`${t} ${rankX}위`))}
          ${step(4, '민감도', keepX === tot ? ok(true, `${t} 1위 유지`) : keepX === 0 ? warnP(`${t} 1위 없음`) : warnP(`${t} 1위 ${keepX}/${tot}`))}
          ${step(5, '선정·남은 위험', rankX === 1 && passX ? ok(true, `${t} 선정`) : warnP('추가 근거 필요'))}
        </div>
        <div class="grid2">
          <div><h3>1. 조건 고정</h3><ul class="tight"><li>칩 발열 ${fmtS(c.Q)} W, 칩 ${fmt(c.chipL / mm, 1)}×${fmt(c.chipW / mm, 1)} mm, 설치 면적 ${fmt(c.L / mm, 1)}×${fmt(c.W / mm, 1)} mm</li><li>T${sb('in')} ${fmt(P.Tin, 0)} °C, 패키지 ${c.layers.length}층 동일, 유체 ${esc(fl.name)}</li><li>비교 기준: ${modeTxt(P)}</li></ul></div>
          <div><h3>2. 필수조건 (하나라도 미달이면 탈락)</h3><div class="tblwrap"><table><thead><tr><th>조건</th><th>A</th><th>B</th><th>C</th></tr></thead><tbody>${reqRows}</tbody></table></div>
            <p class="note">필수조건 통과: ${cand.map((r, i) => `${r.cs.id} ${passAll[i] ? '✓' : '✗'}`).join(', ')}</p></div>
        </div>
        <h3 style="margin-top:10px">3. 가중 점수 (평가기준·가중치)</h3>
        <div class="tblwrap"><table><thead><tr><th>평가기준</th><th class="n">가중치</th><th class="n">A</th><th class="n">B</th><th class="n">C</th></tr></thead><tbody>${scRows}</tbody></table></div>
        <p class="note">항목 점수 1~5점. 가중치는 「5) 가중치 평가표」 탭에서 바꿀 수 있습니다.</p>
        <h3 style="margin-top:10px">4. 민감도</h3>
        <div class="grid2">
          <div><p>가중치를 항목별로 ×0.5, ×2로 바꾼 ${tot}가지 중 1위(${top.r.cs.id})가 유지된 경우는 <b>${keep}가지</b>, ${t}안이 1위인 경우는 <b>${keepX}가지</b>입니다.</p>${flips.length ? `<p class="note">1위가 바뀐 경우: ${flips.join(', ')}</p>` : ''}
            <div class="tblwrap"><table><thead><tr><th>우선순위 시나리오</th><th>1위</th><th class="n">${t} 순위</th></tr></thead><tbody>${presets}</tbody></table></div></div>
          <div><div class="tblwrap"><table><thead><tr><th>운전조건 변화</th><th class="n">${t} T${sb('j,max')} °C</th><th>${t} 필수조건</th><th>최저 T${sb('j')}</th></tr></thead><tbody>${opRows}</tbody></table></div></div>
        </div>
        <h3 style="margin-top:10px">5. 결론, 선택 이유와 남은 위험</h3>
        <div class="card ${rankX === 1 && passX ? 'winner' : ''}" style="margin-bottom:10px"><p style="max-width:none"><b>${decision}</b></p></div>
        <div class="grid2">
          <div><h3>선택 이유</h3><ul class="tight">${TYPE_PROS[t].map(x => `<li>${subFix(x)}</li>`).join('')}<li>대류 저항이 평탄 미세유로 대비 ${fmt(dConv, 0)}% ${dConv >= 0 ? '감소' : '증가'}, T${sb('j,max')}는 ${fmt(Math.abs(ref.Tj - rX.Tj), 1)} K ${ref.Tj >= rX.Tj ? '낮음' : '높음'}</li><li>압력강하 ${fmt(rX.dp / 1e3, 2)} kPa (허용 ${fmtS(dpLim / 1e3)} kPa ${rX.dp <= dpLim * 1.001 ? '이내' : '초과'})</li></ul></div>
          <div><h3>남은 위험</h3><ul class="warnlist">${risks}<li>상관식 기반 1차 설계이므로 CFD 또는 시험으로 확인 필요</li></ul></div>
        </div>
        <h3 style="margin-top:10px">2단계로 넘길 값 (칩 1개 단위셀)</h3>
        <div class="tblwrap"><table><tbody>
          <tr><td>열저항 R${sb('th,j-f')}</td><td class="n">${fmt(rX.Rth, 3)} K/W</td><td>유량</td><td class="n">${fmt(rX.V * 6e4, 3)} L/min</td></tr>
          <tr><td>압력강하 Δp</td><td class="n">${fmt(rX.dp / 1e3, 2)} kPa</td><td>펌프 동력</td><td class="n">${fmt(rX.W, 4)} W</td></tr>
          <tr><td>출구온도 T${sb('out')}</td><td class="n">${fmt(rX.Tout, 1)} °C</td><td>최고온도 T${sb('j,max')}</td><td class="n">${fmt(rX.Tj, 1)} °C</td></tr>
        </tbody></table></div>
        <p class="note">인버터 전체는 칩 수와 배치에 맞춰 병렬 경로는 유량을 더하고, 직렬 칩은 앞 칩의 출구온도를 다음 칩의 입구온도로 써서 계산합니다.</p></div>`;
    document.querySelectorAll('#v-adev [data-jump]').forEach(bt => bt.addEventListener('click', () => { const el = document.getElementById(bt.dataset.jump); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }));
    document.querySelectorAll('#v-adev [data-ad]').forEach(bt => bt.addEventListener('click', () => { adSel = bt.dataset.ad; renderAdev(); }));
  }

  // ---------------- 실행 ----------------
  function renderView(k) {
    try {
      ({ adev: renderAdev, pdf: renderPdf, verify: renderVerify, paper: renderPaper, path: renderPath, fluid: renderFluid, geo: renderGeo, cmp: renderCmp, score: renderScore, sel: renderSel, sweep: renderSweep, notes: renderNotes })[k]();
    } catch (e) { $('#v-' + k).innerHTML = `<div class="card"><b>계산 오류:</b> ${esc(e.message)}. 입력값(0이나 음수, 필라가 피치보다 큰 경우 등)을 확인하세요.</div>`; console.error(e); }
  }
  function recalc() {
    try { compute(); renderSummary(); renderView(active); }
    catch (e) { $('#summary').innerHTML = `<span class="chip" style="color:var(--bad)">입력 오류: ${esc(e.message)}</span>`; console.error(e); }
  }
  let tmr;
  buildInputs();
  buildTabs();
  $('#inputs').addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(recalc, 250); });
  $('#inputs').addEventListener('change', () => { clearTimeout(tmr); tmr = setTimeout(recalc, 50); });
  compute(); renderSummary();
  setTab((location.hash || '').slice(1) || 'adev');
  window.addEventListener('hashchange', () => setTab(location.hash.slice(1)));
})();

</script>
</body>
</html>
